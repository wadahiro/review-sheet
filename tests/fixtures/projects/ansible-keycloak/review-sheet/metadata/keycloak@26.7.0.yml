    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  features:
    description: Enables a set of one or more features.
    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  features-disabled:
    description: Disables a set of one or more features.
    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  file:
    description: Set the path to a file that will be created with the exported data. To export more than 50000 users, export to a directory with different files instead.
    scope: runtime
    group: Export (kc.sh export)
    docs_url: https://www.keycloak.org/server/all-config
  fips-mode:
    description: Sets the FIPS mode. If 'non-strict' is set, FIPS is enabled but on non-approved mode. For full FIPS compliance, set 'strict' to run on approved mode. This option defaults to 'disabled' when 'fips' feature is disabled, which is by default. This option defaults to 'non-strict' when 'fips' feature is enabled.
    default: disabled
    scope: build-time
    group: Security
    docs_url: https://www.keycloak.org/server/all-config
  health-enabled:
    description: If the server should expose health check endpoints. If enabled, health checks are available at the '/health', '/health/ready' and '/health/live' endpoints.
    default: "false"
    scope: build-time
    group: Health
    docs_url: https://www.keycloak.org/server/all-config
  hostname:
    description: Address at which is the server exposed. Can be a full URL, or just a hostname. When only hostname is provided, scheme, port and context path are resolved from the request.
    scope: runtime
    group: Hostname
    docs_url: https://www.keycloak.org/server/all-config
  hostname-admin:
    description: Address for accessing the administration console. Use this option if you are exposing the administration console using a reverse proxy on a different address than specified in the 'hostname' option.
    scope: runtime
    group: Hostname
    docs_url: https://www.keycloak.org/server/all-config
  hostname-backchannel-dynamic:
    description: Enables dynamic resolving of backchannel URLs, including hostname, scheme, port and context path. Set to true if your application accesses Keycloak via a private network. If set to true, 'hostname' option needs to be specified as a full URL.
    default: "false"
    scope: runtime
    group: Hostname
    docs_url: https://www.keycloak.org/server/all-config
  hostname-debug:
    description: Toggles the hostname debug page that is accessible at /realms/master/hostname-debug.
    default: "false"
    scope: runtime
    group: Hostname
    docs_url: https://www.keycloak.org/server/all-config
  hostname-strict:
    description: Disables dynamically resolving the hostname from request headers. Should always be set to true in production, unless your reverse proxy overwrites the Host header. If enabled, the 'hostname' option needs to be specified.
    default: "true"
    scope: runtime
    group: Hostname
    docs_url: https://www.keycloak.org/server/all-config
  http-accept-non-normalized-paths:
    description: If the server should accept paths that are not normalized according to RFC3986 or that contain a double slash ('//') or semicolon (';'). While accepting those requests might be relevant for legacy applications, it is recommended to disable it to allow for more concise URL filtering.
    default: "false"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-enabled:
    description: If HTTP access logging is enabled. By default this will log records in console.
    default: "false"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-exclude:
    description: A regular expression that can be used to exclude some paths from logging. For instance, '/realms/my-realm/.*' will exclude all subsequent endpoints for realm 'my-realm' from the log.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-enabled:
    description: If HTTP access logging should be done to a separate file.
    default: "false"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-name:
    description: The HTTP access log file base name, which will create a log file name concatenating base and suffix (e.g. 'keycloak-http-access.log'). The file is located in the '/data/log' directory of the distribution.
    default: keycloak-http-access
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-rotate:
    description: If the HTTP Access log file should be rotated daily.
    default: "true"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-suffix:
    description: The HTTP access log file suffix. When rotation is enabled, a date-based suffix '.{yyyy-MM-dd}' is added before the specified suffix. If multiple rotations occur on the same day, an incremental index is appended to the date.
    default: .log
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-masked-cookies:
    description: Set of HTTP Cookie headers whose values must be masked when the 'long' pattern or '%{ALL_REQUEST_HEADERS}' format is enabled with the 'http-access-log-pattern' option. Selected security sensitive cookies are always masked.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-masked-headers:
    description: Set of HTTP headers whose values must be masked when the 'long' pattern or '%{ALL_REQUEST_HEADERS}' format is enabled with the 'http-access-log-pattern' option. Selected security sensitive headers are always masked.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-pattern:
    description: The HTTP access log pattern. You can use the available named formats, or use custom format described in Quarkus documentation.
    default: common
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-enabled:
    description: Enables the HTTP listener. Enabled by default in development mode. Typically not enabled in production unless the server is fronted by a TLS termination proxy.
    default: "false"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-host:
    description: The HTTP Host. In prod mode or when running on Windows Subsystem For Linux the default is to bind to all network addresses (0.0.0.0), which means the server may be accessible from other machines on your network. Otherwise defaults to localhost.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-management-enabled:
    description: Placeholder for resolving state of the management interface. If set, the value is ignored.
    default: "false"
    scope: build-time
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-management-health-enabled:
    description: If health endpoints should be exposed on the management interface. If false, health endpoints will be exposed on the main interface.
    default: "true"
    scope: build-time
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-management-host:
    description: Host of the management interface. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-management-port:
    description: Port of the management interface. Relevant only when something is exposed on the management interface - see the guide for details.
    default: "9000"
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-management-relative-path:
    description: Set the path relative to '/' for serving resources from management interface. The path must start with a '/'. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    default: /
    scope: build-time
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-management-scheme:
    description: Configures the management interface scheme. If 'inherited', the management interface will inherit the HTTPS settings of the main interface. If 'http', the management interface will be accessible via HTTP - it will not inherit HTTPS settings and cannot be configured for HTTPS.
    default: inherited
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  http-max-queued-requests:
    description: Maximum number of queued HTTP requests. Use this to shed load in an overload situation. Excess requests will return a "503 Server not Available" response.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-metrics-histograms-enabled:
    description: Enables a histogram with default buckets for the duration of HTTP server requests.
    default: "false"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-metrics-slos:
    description: "Service level objectives for HTTP server requests. Use this instead of the default histogram, or use it in combination to add additional buckets. Specify a list of comma-separated values defined in milliseconds. Example with buckets from 5ms to 10s: 5,10,25,50,250,500,1000,2500,5000,10000"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-pool-max-threads:
    description: The maximum number of threads. If this is not specified then it will be automatically sized to the greater of 4 * the number of available processors and 50. For example if there are 4 processors the max threads will be 50. If there are 48 processors it will be 192.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-port:
    description: The used HTTP port.
    default: "8080"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  http-relative-path:
    description: Set the path relative to '/' for serving resources. The path must start with a '/'.
    default: /
    scope: build-time
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-certificate-file:
    description: The file path to a server certificate or certificate chain in PEM format.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-certificate-key-file:
    description: The file path to a private key in PEM format.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-certificates-reload-period:
    description: Interval on which to reload key store, trust store, and certificate files referenced by https-* options. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d]. Must be greater than 30 seconds. Use -1 to disable.
    default: 1h
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-cipher-suites:
    description: The cipher suites to use. If none is given, a reasonable default is selected.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-client-auth:
    description: Configures the server to require/request client authentication.
    default: none
    scope: build-time
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-key-store-file:
    description: The key store which holds the certificate information instead of specifying separate files.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-key-store-password:
    description: The password of the key store file.
    default: password
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-key-store-type:
    description: The type of the key store file. If not given, the type is automatically detected based on the file extension. If 'fips-mode' is set to 'strict' and no value is set, it defaults to 'BCFKS'.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-management-certificate-file:
    description: The file path to a server certificate or certificate chain in PEM format for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-certificate-key-file:
    description: The file path to a private key in PEM format for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-certificates-reload-period:
    description: Interval on which to reload key store, trust store, and certificate files referenced by https-management-* options for the management server. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d]. Must be greater than 30 seconds. Use -1 to disable. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    default: 1h
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-cipher-suites:
    description: The cipher suites to use for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-client-auth:
    description: Configures the management interface to require/request client authentication. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    default: none
    scope: build-time
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-key-store-file:
    description: The key store which holds the certificate information instead of specifying separate files for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-key-store-password:
    description: The password of the key store file for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    default: password
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-key-store-type:
    description: The type of the key store file for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-protocols:
    description: The list of protocols to explicitly enable for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    default: TLSv1.3,TLSv1.2
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-trust-store-file:
    description: The trust store which holds the certificate information of the certificates to trust for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-trust-store-password:
    description: The password of the trust store file for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-management-trust-store-type:
    description: The type of the trust store file for the management server. If not given, the value is inherited from HTTP options. Relevant only when something is exposed on the management interface - see the guide for details.
    scope: runtime
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  https-port:
    description: The used HTTPS port.
    default: "8443"
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-protocols:
    description: The list of protocols to explicitly enable. If a value is not supported by the JRE / security configuration, it will be silently ignored.
    default: TLSv1.3,TLSv1.2
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-trust-store-file:
    description: The trust store which holds the certificate information of the certificates to trust.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-trust-store-password:
    description: The password of the trust store file.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  https-trust-store-type:
    description: The type of the trust store file. If not given, the type is automatically detected based on the file extension. If 'fips-mode' is set to 'strict' and no value is set, it defaults to 'BCFKS'.
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  legacy-observability-interface:
    description: If metrics/health endpoints should be exposed on the main HTTP server (not recommended). If set to true, the management interface is disabled.
    default: "false"
    scope: build-time
    group: Management interface
    docs_url: https://www.keycloak.org/server/all-config
  log:
    description: Enable one or more log handlers in a comma-separated list.
    default: console
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-async:
    description: Indicates whether to log asynchronously to all handlers.
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-async:
    description: Indicates whether to log asynchronously to console. If not set, value from the parent property 'log-async' is used.
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-async-queue-length:
    description: The queue length to use before flushing writing when logging to console.
    default: "512"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-color:
    description: Enable or disable colors when logging to console. If this is not present then an attempt will be made to guess if the terminal supports color.
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-enabled:
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-format:
    description: The format of unstructured console log entries. If the format has spaces in it, escape the value using "<format>".
    default: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-include-mdc:
    description: Include mdc information in the console log. If the 'log-console-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-include-trace:
    description: Include tracing information in the console log. If the 'log-console-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-json-format:
    description: Set the format of the produced JSON.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-level:
    description: Set the log level for the console handler. It specifies the most verbose log level for logs shown in the output. It respects levels specified in the 'log-level' option, which represents the maximal verbosity for the whole logging system. For more information, check the Logging guide.
    default: all
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-console-output:
    description: Set the log output to JSON or default (plain) unstructured logging.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file:
    description: Set the log file path and filename.
    default: data/log/keycloak.log
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-async:
    description: Indicates whether to log asynchronously to file log. If not set, value from the parent property 'log-async' is used.
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-async-queue-length:
    description: The queue length to use before flushing writing when logging to file log.
    default: "512"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-enabled:
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-format:
    description: Set a format specific to file log entries.
    default: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-include-mdc:
    description: Include MDC information in the file log. If the 'log-file-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-include-trace:
    description: Include tracing information in the file log. If the 'log-file-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-json-format:
    description: Set the format of the produced JSON.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-level:
    description: Set the log level for the file handler. It specifies the most verbose log level for logs shown in the output. It respects levels specified in the 'log-level' option, which represents the maximal verbosity for the whole logging system. For more information, check the Logging guide.
    default: all
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-output:
    description: Set the log output to JSON or default (plain) unstructured logging.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-enabled:
    description: Enables log file rotation.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-file-suffix:
    description: "Set the log file handler rotation file suffix. When used, the file will be rotated based on its suffix. Example: `.yyyy-MM-dd` to rotate daily. Note: If the suffix ends with `.zip` or `.gz`, the rotation file will also be compressed."
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-max-backup-index:
    description: The maximum number of backup log files to keep.
    default: "5"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-max-file-size:
    description: The maximum log file size, after which a rotation is executed. Supports size suffixes (e.g. 10M, 1G).
    default: 10M
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-rotate-on-boot:
    description: Indicates whether to rotate log files on server start.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-level:
    description: The log level of the root category or a comma-separated list of individual categories and their levels. For the root category, you don't need to specify a category.
    default: info
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-level-<category>:
    description: The log level of a category. Takes precedence over the 'log-level' option.
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-mdc-enabled:
    description: Indicates whether to add information about the realm and other information to the mapped diagnostic context. All elements will be prefixed with 'kc.'
    default: "false"
    scope: build-time
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-mdc-keys:
    description: Defines which information should be added to the mapped diagnostic context as a comma-separated list.
    default: realmName,clientId,org,sessionId,authenticationSessionId,authenticationTabId
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-service-environment:
    description: Set the 'service.environment' field in JSON log entries for all log handlers. In ECS format, defaults to the Quarkus profile if not set.
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-service-name:
    description: Set the 'service.name' field in JSON log entries for all log handlers.
    default: keycloak
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-app-name:
    description: Set the app name used when formatting the message in RFC5424 format.
    default: keycloak
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-async:
    description: Indicates whether to log asynchronously to Syslog. If not set, value from the parent property 'log-async' is used.
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-async-queue-length:
    description: The queue length to use before flushing writing when logging to Syslog.
    default: "512"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-counting-framing:
    description: If 'true', the message being sent is prefixed with the size of the message. If 'protocol-dependent', the default value is 'true' when 'log-syslog-protocol' is 'tcp' or 'ssl-tcp', otherwise 'false'.
    default: protocol-dependent
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-enabled:
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-endpoint:
    description: Set the IP address and port of the Syslog server.
    default: localhost:514
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-format:
    description: Set a format specific to Syslog entries.
    default: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-include-mdc:
    description: Include MDC information in the Syslog. If the 'log-syslog-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-include-trace:
    description: Include tracing information in the Syslog. If the 'log-syslog-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-json-format:
    description: Set the format of the produced JSON.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-level:
    description: Set the log level for the Syslog handler. It specifies the most verbose log level for logs shown in the output. It respects levels specified in the 'log-level' option, which represents the maximal verbosity for the whole logging system. For more information, check the Logging guide.
    default: all
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-max-length:
    description: Set the maximum length, in bytes, of the message allowed to be sent. The length includes the header and the message. If not set, the default value is 2048 when 'log-syslog-type' is rfc5424 (default) and 1024 when 'log-syslog-type' is rfc3164.
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-output:
    description: Set the Syslog output to JSON or default (plain) unstructured logging.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-protocol:
    description: Set the protocol used to connect to the Syslog server.
    default: tcp
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-type:
    description: Set the Syslog type used to format the sent message.
    default: rfc5424
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  metrics-enabled:
    description: If the server should expose metrics. If enabled, metrics are available at the '/metrics' endpoint.
    default: "false"
    scope: build-time
    group: Metrics
    docs_url: https://www.keycloak.org/server/all-config
  openapi-enabled:
    description: If the server should expose OpenAPI Endpoint. If enabled, OpenAPI is available at '/openapi'.
    default: "false"
    scope: build-time
    group: OpenAPI
    docs_url: https://www.keycloak.org/server/all-config
  openapi-ui-enabled:
    description: If the server should expose OpenApi-UI Endpoint. If enabled, OpenAPI UI is available at '/openapi/ui'.
    default: "false"
    scope: build-time
    group: OpenAPI
    docs_url: https://www.keycloak.org/server/all-config
  override:
    description: Set if existing data should be overwritten. If set to false, data will be ignored.
    default: "true"
    scope: runtime
    group: Import (kc.sh import)
    docs_url: https://www.keycloak.org/server/all-config
  proxy-headers:
    description: The proxy headers that should be accepted by the server. Misconfiguration might leave the server exposed to security vulnerabilities. Takes precedence over the deprecated proxy option.
    scope: runtime
    group: Reverse proxy
    docs_url: https://www.keycloak.org/server/all-config
  proxy-protocol-enabled:
    description: Whether the server should use the HA PROXY protocol when serving requests from behind a proxy. When set to true, the remote address returned will be the one from the actual connecting client. Cannot be enabled when the `proxy-headers` is used.
    default: "false"
    scope: runtime
    group: Reverse proxy
    docs_url: https://www.keycloak.org/server/all-config
  proxy-trusted-addresses:
    description: A comma separated list of trusted proxy addresses. If set, then proxy headers from other addresses will be ignored. By default all addresses are trusted. A trusted proxy address is specified as an IP address (IPv4 or IPv6) or Classless Inter-Domain Routing (CIDR) notation. Available only when proxy-headers is set.
    scope: runtime
    group: Reverse proxy
    docs_url: https://www.keycloak.org/server/all-config
  realm:
    description: Set the name of the realm to export. If not set, all realms are going to be exported.
    scope: runtime
    group: Export (kc.sh export)
    docs_url: https://www.keycloak.org/server/all-config
  server-async-bootstrap:
    description: If true, endpoints are opened while the bootstrap runs in the background. If false, endpoints are opened after bootstrap completes, ensuring the server is ready to handle requests. Async bootstrap is enabled by default when the health endpoints are also enabled, unless this option is explicitly set to false.
    scope: runtime
    group: Server
    docs_url: https://www.keycloak.org/server/all-config
  shutdown-delay:
    description: Length of the pre-shutdown phase during which the server prepares for shutdown. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d]. This period allows for loadbalancer reconfiguration and draining of TLS/HTTP keepalive connections.
    default: 1s
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  shutdown-timeout:
    description: The shutdown period waiting for currently running HTTP requests to finish and distributed caches to settle. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d].
    default: 10s
    scope: runtime
    group: HTTP / TLS
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-endpoint:
    description: OpenTelemetry endpoint to connect to.
    default: http://localhost:4317
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-header-<header>:
    description: General OpenTelemetry header that will be part of the exporter request (mainly useful for providing Authorization header). Check the documentation on how to set environment variables for headers containing special characters or custom case-sensitive headers.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-enabled:
    description: Enables exporting logs to a destination handling OpenTelemetry logs.
    default: "false"
    scope: build-time
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-endpoint:
    description: OpenTelemetry endpoint to export logs to. If not given, the value is inherited from the 'telemetry-endpoint' option.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-header-<header>:
    description: OpenTelemetry header that will be part of the log exporter request (mainly useful for providing Authorization header). Check the documentation on how to set environment variables for headers containing special characters or custom case-sensitive headers.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-headers:
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-level:
    description: The most verbose log level exported to the telemetry endpoint. For more information, check the Telemetry guide.
    default: all
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-logs-protocol:
    description: OpenTelemetry protocol used for exporting logs. If not given, the value is inherited from the 'telemetry-protocol' option.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-enabled:
    description: Enables exporting metrics to a destination handling OpenTelemetry metrics.
    default: "false"
    scope: build-time
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-endpoint:
    description: OpenTelemetry endpoint to connect to for Metrics. If not given, the value is inherited from the 'telemetry-endpoint' option.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-header-<header>:
    description: OpenTelemetry header that will be part of the metrics exporter request (mainly useful for providing Authorization header). Check the documentation on how to set environment variables for headers containing special characters or custom case-sensitive headers.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-headers:
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-interval:
    description: The interval between the start of two metric export attempts to the destination handling OpenTelemetry metrics data. It accepts simplified format for time units as java.time.Duration (like 5000ms, 30s, 5m, 1h). If the value is only a number, it represents time in seconds.
    default: 60s
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-metrics-protocol:
    description: OpenTelemetry protocol used for the metrics telemetry data. If not given, the value is inherited from the 'telemetry-protocol' option.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-protocol:
    description: OpenTelemetry protocol used for the communication between server and OpenTelemetry collector.
    default: grpc
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-resource-attributes:
    description: OpenTelemetry resource attributes characterize the telemetry producer. Values in format 'key1=val1,key2=val2'.
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  telemetry-service-name:
    description: OpenTelemetry service name. Takes precedence over 'service.name' defined in the 'telemetry-resource-attributes' property.
    default: keycloak
    scope: runtime
    group: Telemetry (OpenTelemetry)
    docs_url: https://www.keycloak.org/server/all-config
  tls-hostname-verifier:
    description: The TLS hostname verification policy for out-going HTTPS and SMTP requests. ANY should not be used in production.
    default: DEFAULT
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  tracing-compression:
    description: OpenTelemetry compression method used to compress payloads. If unset, compression is disabled.
    default: none
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-enabled:
    description: Enables the OpenTelemetry tracing.
    default: "false"
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-endpoint:
    description: OpenTelemetry endpoint to connect to for traces. If not given, the value is inherited from the 'telemetry-endpoint' option.
    default: http://localhost:4317
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-header-<header>:
    description: OpenTelemetry header that will be part of the exporter request (mainly useful for providing Authorization header). Check the documentation on how to set environment variables for headers containing special characters or custom case-sensitive headers.
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-headers:
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-infinispan-enabled:
    description: Enables the OpenTelemetry tracing for embedded Infinispan.
    default: "true"
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-jdbc-enabled:
    description: Enables the OpenTelemetry JDBC tracing.
    default: "true"
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-protocol:
    description: OpenTelemetry protocol used for the telemetry data. If not given, the value is inherited from the 'telemetry-protocol' option.
    default: grpc
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-resource-attributes:
    description: OpenTelemetry resource attributes present in the exported trace to characterize the telemetry producer. Values in format 'key1=val1,key2=val2'. If not given, the value is inherited from the 'telemetry-resource-attributes' option. For more information, check the Tracing guide.
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-sampler-ratio:
    description: OpenTelemetry sampler ratio. Probability that a span will be sampled. Expected double value in interval [0,1].
    default: "1.0"
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-sampler-type:
    description: OpenTelemetry sampler to use for tracing.
    default: traceidratio
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-service-name:
    description: OpenTelemetry service name. Takes precedence over 'service.name' defined in the 'tracing-resource-attributes' property. If not given, the value is inherited from the 'telemetry-service-name' option.
    default: keycloak
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  transaction-default-timeout:
    description: The default transaction timeout. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d].
    default: 5m
    scope: runtime
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-setup-timeout:
    description: The transaction timeout for database migration/import/export transactions. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d].
    default: 30m
    scope: runtime
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-xa-enabled:
    description: If set to true, XA datasources will be used.
    default: "false"
    scope: build-time
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-xa-enabled-<datasource>:
    description: If set to true, XA for <datasource> datasource will be used.
    default: "true"
    scope: build-time
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  truststore-kubernetes-enabled:
    description: If enabled, the server will automatically include the default Kubernetes service account CA certificate from "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt" and the OpenShift service CA certificate from "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt" when running in a container environment.
    default: "true"
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  truststore-paths:
    description: List of pkcs12 (p12, pfx, or pkcs12 file extensions), PEM files, or directories containing those files that will be used as a system truststore.
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  users:
    description: Set how users should be exported.
    default: different_files
    scope: runtime
    group: Export (kc.sh export)
    docs_url: https://www.keycloak.org/server/all-config
  users-per-file:
    description: Set the number of users per file. It is used only if 'users' is set to 'different_files'.
    default: "50"
    scope: runtime
    group: Export (kc.sh export)
    docs_url: https://www.keycloak.org/server/all-config
  vault:
    description: Enables a vault provider.
    scope: build-time
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-dir:
    description: If set, secrets can be obtained by reading the content of files within the given directory.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-file:
    description: Path to the keystore file.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-pass:
    description: Password for the vault keystore.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-type:
    description: Specifies the type of the keystore file.
    default: PKCS12
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
