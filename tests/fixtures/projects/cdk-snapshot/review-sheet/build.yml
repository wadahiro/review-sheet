# Declarative build spec for `import --spec` (see src/spec.ts and the
# "snapshot" recipe, src/recipes/snapshot.ts). Paths are relative to this
# file's own directory (examples/cdk-snapshot/review-sheet/).
#
# One sheet, one artifact per environment. The stack's per-environment
# divergence lives in program logic (`prod ? 50 : 5` in ../app/api-stack.ts),
# so there is no base + overlay pair to layer: each committed `cdk synth`
# template IS that environment's values, and every parameter comes out as
# Pattern B (one column per environment).

version: 1

metadata:
  title: "API stack (AWS CDK) — synthesized parameter sheet"
  project: "cdk-snapshot example"

instances: [staging, production]

# The templates are regenerated by `cdk synth`, so an edit written into them
# would be lost — the whole sheet is read-only. Every value additionally carries
# `source.generated: true` (set by the recipe), which is what makes `apply` hold
# a change for the AI prompt instead of writing it.
capabilities:
  apply: false

enrich:
  project: sheet.yml

sheets:
  - name: API stack
    recipe: snapshot
    snapshots:
      staging: ../snapshots/StagingApiStack.template.json
      production: ../snapshots/ProductionApiStack.template.json
    # A synthesized template carries far more scalars than anyone reviews.
    # `include`/`exclude` select the reviewable subset by structural path
    # (`*` matches within one path segment, `**` crosses segments); everything
    # else is dropped before assembly, so it never reaches the sheet.
    include:
      - "Resources.*.Properties.**"
      - "Resources.*.DeletionPolicy"
    exclude:
      # CDK-generated IAM wiring: reviewed in the IAM baseline, not here.
      - "Resources.ApiFunctionServiceRole*.**"
      # Table schema (not a tunable) and the asset the code is bundled into.
      - "**.KeySchema**"
      - "**.AttributeDefinitions**"
      - "**.Code.**"
      # CloudFormation intrinsics: a `Ref` / `Fn::*` resolves at deploy time, so
      # there is no reviewable value in the template.
      - "**.Ref"
      - "**.Fn::**"
