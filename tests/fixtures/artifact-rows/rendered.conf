# rendered from app.conf.j2 with defaults.yml — the artifact this sheet claims to describe
Listen 80
DocumentRoot "/var/www/html"
CustomLog "/var/log/app/access_log" combined
LogLevel warn
ProxyPass "/health" "http://127.0.0.1:9000/health"
ProxyPassReverse "/health" "http://127.0.0.1:9000/health"
ProxyPass "/" "http://127.0.0.1:8080/"
ProxyPassReverse "/" "http://127.0.0.1:8080/"
<IfModule mpm_event_module>
    StartServers 3
    ThreadsPerChild 25
</IfModule>
