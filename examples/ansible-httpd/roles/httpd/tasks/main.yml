---
- name: Install httpd
  ansible.builtin.package:
    name: httpd
    state: present

- name: Deploy httpd.conf (templated from the per-environment values)
  ansible.builtin.template:
    src: httpd.conf.j2
    dest: /etc/httpd/conf/httpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Ensure httpd is started and enabled
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
