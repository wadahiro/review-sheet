      en: Location of the SSL certificate revocation list directory.
    default: ""
    type: string
    group: Connections and Authentication / SSL
  ssl_crl_file:
    description:
      en: Location of the SSL certificate revocation list file.
    default: ""
    type: string
    group: Connections and Authentication / SSL
  ssl_dh_params_file:
    description:
      en: Location of the SSL DH parameters file.
    default: ""
    type: string
    group: Connections and Authentication / SSL
