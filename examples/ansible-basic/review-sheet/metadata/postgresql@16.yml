  log_lock_waits:
    description:
      en: Logs long lock waits.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_min_duration_sample:
    description:
      en: Sets the minimum execution time above which a sample of statements will be logged. Sampling is determined by log_statement_sample_rate.
    default: "-1"
    type: integer
    group: Reporting and Logging / When to Log
  log_min_duration_statement:
    description:
      en: Sets the minimum execution time above which all statements will be logged.
    default: "-1"
    type: integer
    group: Reporting and Logging / When to Log
  log_min_error_statement:
    description:
      en: Causes all statements generating error at or above this level to be logged.
    default: error
    type: enum
    group: Reporting and Logging / When to Log
  log_min_messages:
    description:
      en: Sets the message levels that are logged.
    default: warning
    type: enum
    group: Reporting and Logging / When to Log
  log_parameter_max_length:
    description:
      en: Sets the maximum length in bytes of data logged for bind parameter values when logging statements.
    default: "-1"
    type: integer
    group: Reporting and Logging / What to Log
  log_parameter_max_length_on_error:
    description:
      en: Sets the maximum length in bytes of data logged for bind parameter values when logging statements, on error.
    default: 0TB
    type: integer
    group: Reporting and Logging / What to Log
  log_parser_stats:
    description:
      en: Writes parser performance statistics to the server log.
    default: off
    type: bool
    group: Statistics / Monitoring
  log_planner_stats:
    description:
      en: Writes planner performance statistics to the server log.
    default: off
    type: bool
    group: Statistics / Monitoring
  log_recovery_conflict_waits:
    description:
      en: Logs standby recovery conflict waits.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_replication_commands:
    description:
      en: Logs each replication command.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_rotation_age:
    description:
      en: Sets the amount of time to wait before forcing log file rotation.
    default: 1d
    type: integer
    group: Reporting and Logging / Where to Log
  log_rotation_size:
    description:
      en: Sets the maximum size a log file can reach before being rotated.
    default: 10MB
    type: integer
    group: Reporting and Logging / Where to Log
  log_startup_progress_interval:
    description:
      en: Time between progress updates for long-running startup operations.
    default: 10s
    type: integer
    group: Reporting and Logging / When to Log
  log_statement:
    description:
      en: Sets the type of statements logged.
    default: none
    type: enum
    group: Reporting and Logging / What to Log
  log_statement_sample_rate:
    description:
      en: Fraction of statements exceeding log_min_duration_sample to be logged.
    default: "1"
    type: real
    group: Reporting and Logging / When to Log
  log_statement_stats:
    description:
      en: Writes cumulative performance statistics to the server log.
    default: off
    type: bool
    group: Statistics / Monitoring
  log_temp_files:
    description:
      en: Log the use of temporary files larger than this number of kilobytes.
    default: "-1"
    type: integer
    group: Reporting and Logging / What to Log
  log_timezone:
    description:
      en: Sets the time zone to use in log messages.
    default: GMT
    type: string
    group: Reporting and Logging / What to Log
  log_transaction_sample_rate:
    description:
      en: Sets the fraction of transactions from which to log all statements.
    default: "0"
    type: real
    group: Reporting and Logging / When to Log
  log_truncate_on_rotation:
    description:
      en: Truncate existing log files of same name during log rotation.
    default: off
    type: bool
    group: Reporting and Logging / Where to Log
  maintenance_io_concurrency:
    description:
      en: A variant of effective_io_concurrency that is used for maintenance work.
    default: "10"
    type: integer
    group: Resource Usage / Asynchronous Behavior
  maintenance_work_mem:
    description:
      en: Sets the maximum memory to be used for maintenance operations.
    default: 64MB
    type: integer
    group: Resource Usage / Memory
  max_connections:
    description:
      en: Sets the maximum number of concurrent connections.
    default: "100"
    type: integer
    group: Connections and Authentication / Connection Settings
  max_files_per_process:
    description:
      en: Sets the maximum number of simultaneously open files for each server process.
    default: "1000"
    type: integer
    group: Resource Usage / Kernel Resources
  max_function_args:
    description:
      en: Shows the maximum number of function arguments.
    default: "100"
    type: integer
    group: Preset Options
  max_identifier_length:
    description:
      en: Shows the maximum identifier length.
    default: "63"
    type: integer
    group: Preset Options
  max_index_keys:
    description:
      en: Shows the maximum number of index keys.
    default: "32"
    type: integer
    group: Preset Options
  max_locks_per_transaction:
    description:
      en: Sets the maximum number of locks per transaction.
    default: "64"
    type: integer
