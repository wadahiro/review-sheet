  max_parallel_apply_workers_per_subscription:
    description:
      en: Maximum number of parallel apply workers per subscription.
    default: "2"
    type: integer
    group: Replication / Subscribers
  max_parallel_maintenance_workers:
    description:
      en: Sets the maximum number of parallel processes per maintenance operation.
    default: "2"
    type: integer
    group: Resource Usage / Asynchronous Behavior
  max_parallel_workers:
    description:
      en: Sets the maximum number of parallel workers that can be active at one time.
    default: "8"
    type: integer
    group: Resource Usage / Asynchronous Behavior
  max_parallel_workers_per_gather:
    description:
      en: Sets the maximum number of parallel processes per executor node.
    default: "2"
    type: integer
    group: Resource Usage / Asynchronous Behavior
  max_pred_locks_per_page:
    description:
      en: Sets the maximum number of predicate-locked tuples per page.
    default: "2"
    type: integer
    group: Lock Management
  max_pred_locks_per_relation:
    description:
      en: Sets the maximum number of predicate-locked pages and tuples per relation.
    default: "-2"
    type: integer
    group: Lock Management
  max_pred_locks_per_transaction:
    description:
      en: Sets the maximum number of predicate locks per transaction.
    default: "64"
    type: integer
    group: Lock Management
  max_prepared_transactions:
    description:
      en: Sets the maximum number of simultaneously prepared transactions.
    default: "0"
    type: integer
    group: Resource Usage / Memory
  max_replication_slots:
    description:
      en: Sets the maximum number of simultaneously defined replication slots.
