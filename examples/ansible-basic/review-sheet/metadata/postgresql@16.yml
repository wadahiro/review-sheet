      en: When generating SQL fragments, quote all identifiers.
    default: off
    type: bool
    group: Version and Platform Compatibility / Previous PostgreSQL Versions
  random_page_cost:
    description:
      en: Sets the planner's estimate of the cost of a nonsequentially fetched disk page.
    default: "4"
    type: real
    group: Query Tuning / Planner Cost Constants
