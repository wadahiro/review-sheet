  lc_messages:
    description:
      en: Sets the language in which messages are displayed.
    default: ""
    type: string
    group: Client Connection Defaults / Locale and Formatting
  lc_monetary:
    description:
      en: Sets the locale for formatting monetary amounts.
    default: C
    type: string
    group: Client Connection Defaults / Locale and Formatting
  lc_numeric:
    description:
      en: Sets the locale for formatting numbers.
    default: C
    type: string
    group: Client Connection Defaults / Locale and Formatting
  lc_time:
    description:
      en: Sets the locale for formatting date and time values.
    default: C
    type: string
    group: Client Connection Defaults / Locale and Formatting
  listen_addresses:
    description:
      en: Sets the host name or IP address(es) to listen to.
    default: localhost
    type: string
    group: Connections and Authentication / Connection Settings
  local_preload_libraries:
    description:
      en: Lists unprivileged shared libraries to preload into each backend.
    default: ""
    type: string
    group: Client Connection Defaults / Shared Library Preloading
  lock_timeout:
    description:
      en: Sets the maximum allowed duration of any wait for a lock.
    default: 0d
    type: integer
    group: Client Connection Defaults / Statement Behavior
  lo_compat_privileges:
    description:
      en: Enables backward compatibility mode for privilege checks on large objects.
    default: off
    type: bool
    group: Version and Platform Compatibility / Previous PostgreSQL Versions
  log_autovacuum_min_duration:
    description:
      en: Sets the minimum execution time above which autovacuum actions will be logged.
    default: 10min
    type: integer
    group: Reporting and Logging / What to Log
  log_checkpoints:
    description:
      en: Logs each checkpoint.
    default: on
    type: bool
    group: Reporting and Logging / What to Log
  log_connections:
    description:
      en: Logs each successful connection.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_destination:
    description:
      en: Sets the destination for server log output.
    default: stderr
    type: string
    group: Reporting and Logging / Where to Log
  log_directory:
    description:
      en: Sets the destination directory for log files.
    default: log
    type: string
    group: Reporting and Logging / Where to Log
  log_disconnections:
    description:
      en: Logs end of a session, including duration.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_duration:
    description:
      en: Logs the duration of each completed SQL statement.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  log_error_verbosity:
    description:
      en: Sets the verbosity of logged messages.
    default: default
    type: enum
    group: Reporting and Logging / What to Log
  log_executor_stats:
    description:
      en: Writes executor performance statistics to the server log.
    default: off
    type: bool
    group: Statistics / Monitoring
  log_file_mode:
    description:
      en: Sets the file permissions for log files.
    default: "384"
    type: integer
    group: Reporting and Logging / Where to Log
  log_filename:
    description:
      en: Sets the file name pattern for log files.
    default: postgresql-%Y-%m-%d_%H%M%S.log
    type: string
    group: Reporting and Logging / Where to Log
  logging_collector:
    description:
      en: Start a subprocess to capture stderr, csvlog and/or jsonlog into log files.
    default: off
    type: bool
    group: Reporting and Logging / Where to Log
  log_hostname:
    description:
      en: Logs the host name in the connection logs.
    default: off
    type: bool
    group: Reporting and Logging / What to Log
  logical_decoding_work_mem:
    description:
      en: Sets the maximum memory to be used for logical decoding.
    default: 64MB
    type: integer
    group: Resource Usage / Memory
  log_line_prefix:
    description:
      en: Controls information prefixed to each log line.
    default: "%m [%p] "
