  max_worker_processes:
    description:
      en: Maximum number of concurrent worker processes.
    default: "8"
    type: integer
    group: Resource Usage / Asynchronous Behavior
  min_dynamic_shared_memory:
    description:
      en: Amount of dynamic shared memory reserved at startup.
    default: 0TB
