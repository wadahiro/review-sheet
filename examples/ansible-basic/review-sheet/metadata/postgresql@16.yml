    type: string
    group: Preset Options
  server_version_num:
    description:
      en: Shows the server version as an integer.
    default: "160014"
    type: integer
    group: Preset Options
  session_preload_libraries:
    description:
      en: Lists shared libraries to preload into each backend.
    default: ""
    type: string
    group: Client Connection Defaults / Shared Library Preloading
  session_replication_role:
