    description:
      en: Sets the minimum amount of table data for a parallel scan.
    default: 8MB
    type: integer
    group: Query Tuning / Planner Cost Constants
  min_wal_size:
    description:
      en: Sets the minimum size to shrink the WAL to.
    default: 80MB
    type: integer
