    type: bool
    group: Connections and Authentication / SSL
  ssl_prefer_server_ciphers:
    description:
      en: Give priority to server ciphersuite order.
    default: on
    type: bool
    group: Connections and Authentication / SSL
  standard_conforming_strings:
    description:
      en: Causes '...' strings to treat backslashes literally.
    default: on
    type: bool
    group: Version and Platform Compatibility / Previous PostgreSQL Versions
  statement_timeout:
    description:
      en: Sets the maximum allowed duration of any statement.
    default: 0d
    type: integer
    group: Client Connection Defaults / Statement Behavior
  stats_fetch_consistency:
    description:
      en: Sets the consistency of accesses to statistics data.
    default: cache
    type: enum
    group: Statistics / Cumulative Query and Index Statistics
  superuser_reserved_connections:
    description:
      en: Sets the number of connection slots reserved for superusers.
    default: "3"
    type: integer
    group: Connections and Authentication / Connection Settings
  synchronize_seqscans:
    description:
      en: Enable synchronized sequential scans.
    default: on
    type: bool
    group: Version and Platform Compatibility / Previous PostgreSQL Versions
  synchronous_commit:
    description:
      en: Sets the current transaction's synchronization level.
    default: on
    type: enum
    group: Write-Ahead Log / Settings
  synchronous_standby_names:
    description:
      en: Number of synchronous standbys and list of names of potential synchronous ones.
    default: ""
    type: string
    group: Replication / Primary Server
  syslog_facility:
    description:
      en: Sets the syslog "facility" to be used when syslog enabled.
    default: local0
    type: enum
    group: Reporting and Logging / Where to Log
  syslog_ident:
    description:
      en: Sets the program name used to identify PostgreSQL messages in syslog.
    default: postgres
    type: string
    group: Reporting and Logging / Where to Log
  syslog_sequence_numbers:
    description:
      en: Add sequence number to syslog messages to avoid duplicate suppression.
    default: on
    type: bool
    group: Reporting and Logging / Where to Log
  syslog_split_messages:
    description:
      en: Split messages sent to syslog by lines and to fit into 1024 bytes.
    default: on
    type: bool
    group: Reporting and Logging / Where to Log
  tcp_keepalives_count:
    description:
      en: Maximum number of TCP keepalive retransmits.
    default: "0"
    type: integer
    group: Connections and Authentication / TCP Settings
  tcp_keepalives_idle:
    description:
      en: Time between issuing TCP keepalives.
    default: 0d
    type: integer
    group: Connections and Authentication / TCP Settings
  tcp_keepalives_interval:
    description:
      en: Time between TCP keepalive retransmits.
    default: 0d
    type: integer
    group: Connections and Authentication / TCP Settings
  tcp_user_timeout:
    description:
      en: TCP user timeout.
    default: 0d
    type: integer
    group: Connections and Authentication / TCP Settings
  temp_buffers:
    description:
      en: Sets the maximum number of temporary buffers used by each session.
    default: 8MB
    type: integer
    group: Resource Usage / Memory
  temp_file_limit:
    description:
      en: Limits the total size of all temporary files used by each process.
    default: "-1"
    type: integer
    group: Resource Usage / Disk
  temp_tablespaces:
    description:
      en: Sets the tablespace(s) to use for temporary tables and sort files.
    default: ""
    type: string
    group: Client Connection Defaults / Statement Behavior
  TimeZone:
    description:
      en: Sets the time zone for displaying and interpreting time stamps.
    default: GMT
    type: string
    group: Client Connection Defaults / Locale and Formatting
  timezone_abbreviations:
    description:
      en: Selects a file of time zone abbreviations.
    default: ""
    type: string
    group: Client Connection Defaults / Locale and Formatting
  trace_notify:
    description:
      en: Generates debugging output for LISTEN and NOTIFY.
    default: off
    type: bool
    group: Developer Options
  trace_recovery_messages:
    description:
      en: Enables logging of recovery-related debugging information.
    default: log
    type: enum
    group: Developer Options
  trace_sort:
    description:
      en: Emit information about resource usage in sorting.
    default: off
    type: bool
    group: Developer Options
  track_activities:
    description:
      en: Collects information about executing commands.
    default: on
    type: bool
    group: Statistics / Cumulative Query and Index Statistics
  track_activity_query_size:
    description:
      en: Sets the size reserved for pg_stat_activity.query, in bytes.
    default: 1kB
    type: integer
    group: Statistics / Cumulative Query and Index Statistics
  track_commit_timestamp:
    description:
      en: Collects transaction commit time.
    default: off
    type: bool
    group: Replication / Sending Servers
  track_counts:
    description:
      en: Collects statistics on database activity.
    default: on
    type: bool
    group: Statistics / Cumulative Query and Index Statistics
  track_functions:
    description:
      en: Collects function-level statistics on database activity.
    default: none
    type: enum
    group: Statistics / Cumulative Query and Index Statistics
  track_io_timing:
    description:
      en: Collects timing statistics for database I/O activity.
    default: off
    type: bool
    group: Statistics / Cumulative Query and Index Statistics
  track_wal_io_timing:
    description:
      en: Collects timing statistics for WAL I/O activity.
    default: off
    type: bool
    group: Statistics / Cumulative Query and Index Statistics
  transaction_deferrable:
    description:
      en: Whether to defer a read-only serializable transaction until it can be executed with no possible serialization failures.
    default: off
    type: bool
    group: Client Connection Defaults / Statement Behavior
  transaction_isolation:
    description:
      en: Sets the current transaction's isolation level.
    default: read committed
    type: enum
    group: Client Connection Defaults / Statement Behavior
  transaction_read_only:
    description:
      en: Sets the current transaction's read-only status.
    default: off
    type: bool
    group: Client Connection Defaults / Statement Behavior
  transform_null_equals:
    description:
      en: Treats "expr=NULL" as "expr IS NULL".
    default: off
    type: bool
    group: Version and Platform Compatibility / Other Platforms and Clients
  unix_socket_directories:
    description:
      en: Sets the directories where Unix-domain sockets will be created.
    default: /var/run/postgresql
    type: string
    group: Connections and Authentication / Connection Settings
  unix_socket_group:
    description:
      en: Sets the owning group of the Unix-domain socket.
    default: ""
    type: string
    group: Connections and Authentication / Connection Settings
  unix_socket_permissions:
    description:
      en: Sets the access permissions of the Unix-domain socket.
    default: "511"
    type: integer
    group: Connections and Authentication / Connection Settings
  update_process_title:
    description:
      en: Updates the process title to show the active SQL command.
    default: on
    type: bool
    group: Reporting and Logging / Process Title
  vacuum_buffer_usage_limit:
    description:
      en: Sets the buffer pool size for VACUUM, ANALYZE, and autovacuum.
    default: 256kB
    type: integer
    group: Resource Usage / Memory
  vacuum_cost_delay:
    description:
      en: Vacuum cost delay in milliseconds.
    default: 0d
    type: real
    group: Resource Usage / Cost-Based Vacuum Delay
  vacuum_cost_limit:
    description:
      en: Vacuum cost amount available before napping.
    default: "200"
    type: integer
    group: Resource Usage / Cost-Based Vacuum Delay
  vacuum_cost_page_dirty:
    description:
      en: Vacuum cost for a page dirtied by vacuum.
    default: "20"
    type: integer
    group: Resource Usage / Cost-Based Vacuum Delay
  vacuum_cost_page_hit:
    description:
      en: Vacuum cost for a page found in the buffer cache.
    default: "1"
    type: integer
    group: Resource Usage / Cost-Based Vacuum Delay
  vacuum_cost_page_miss:
    description:
      en: Vacuum cost for a page not found in the buffer cache.
    default: "2"
    type: integer
    group: Resource Usage / Cost-Based Vacuum Delay
  vacuum_failsafe_age:
    description:
      en: Age at which VACUUM should trigger failsafe to avoid a wraparound outage.
    default: "1600000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  vacuum_freeze_min_age:
    description:
      en: Minimum age at which VACUUM should freeze a table row.
    default: "50000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  vacuum_freeze_table_age:
    description:
      en: Age at which VACUUM should scan whole table to freeze tuples.
    default: "150000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  vacuum_multixact_failsafe_age:
    description:
      en: Multixact age at which VACUUM should trigger failsafe to avoid a wraparound outage.
    default: "1600000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  vacuum_multixact_freeze_min_age:
    description:
      en: Minimum age at which VACUUM should freeze a MultiXactId in a table row.
    default: "5000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  vacuum_multixact_freeze_table_age:
    description:
      en: Multixact age at which VACUUM should scan whole table to freeze tuples.
    default: "150000000"
    type: integer
    group: Client Connection Defaults / Statement Behavior
  wal_block_size:
    description:
      en: Shows the block size in the write ahead log.
    default: "8192"
    type: integer
    group: Preset Options
  wal_buffers:
    description:
      en: Sets the number of disk-page buffers in shared memory for WAL.
    default: "-1"
    type: integer
    group: Write-Ahead Log / Settings
  wal_compression:
    description:
      en: Compresses full-page writes written in WAL file with specified method.
    default: off
    type: enum
    group: Write-Ahead Log / Settings
  wal_consistency_checking:
    description:
      en: Sets the WAL resource managers for which WAL consistency checks are done.
    default: ""
    type: string
    group: Developer Options
  wal_decode_buffer_size:
    description:
      en: Buffer size for reading ahead in the WAL during recovery.
    default: 512kB
    type: integer
    group: Write-Ahead Log / Recovery
  wal_init_zero:
    description:
      en: Writes zeroes to new WAL files before first use.
    default: on
    type: bool
    group: Write-Ahead Log / Settings
  wal_keep_size:
    description:
      en: Sets the size of WAL files held for standby servers.
    default: 0TB
    type: integer
    group: Replication / Sending Servers
  wal_level:
    description:
      en: Sets the level of information written to the WAL.
    default: replica
    type: enum
    group: Write-Ahead Log / Settings
  wal_log_hints:
    description:
      en: Writes full pages to WAL when first modified after a checkpoint, even for a non-critical modification.
    default: off
    type: bool
    group: Write-Ahead Log / Settings
  wal_receiver_create_temp_slot:
    description:
      en: Sets whether a WAL receiver should create a temporary replication slot if no permanent slot is configured.
    default: off
    type: bool
    group: Replication / Standby Servers
  wal_receiver_status_interval:
    description:
      en: Sets the maximum interval between WAL receiver status reports to the sending server.
    default: 10s
    type: integer
    group: Replication / Standby Servers
  wal_receiver_timeout:
    description:
      en: Sets the maximum wait time to receive data from the sending server.
    default: 1min
    type: integer
    group: Replication / Standby Servers
  wal_recycle:
    description:
      en: Recycles WAL files by renaming them.
    default: on
    type: bool
    group: Write-Ahead Log / Settings
  wal_retrieve_retry_interval:
    description:
      en: Sets the time to wait before retrying to retrieve WAL after a failed attempt.
    default: 5s
    type: integer
    group: Replication / Standby Servers
  wal_segment_size:
    description:
      en: Shows the size of write ahead log segments.
    default: 16MB
    type: integer
    group: Preset Options
  wal_sender_timeout:
    description:
      en: Sets the maximum time to wait for WAL replication.
    default: 1min
    type: integer
    group: Replication / Sending Servers
  wal_skip_threshold:
    description:
      en: Minimum size of new file to fsync instead of writing WAL.
    default: 2MB
    type: integer
    group: Write-Ahead Log / Settings
  wal_sync_method:
    description:
      en: Selects the method used for forcing WAL updates to disk.
    default: fdatasync
    type: enum
    group: Write-Ahead Log / Settings
  wal_writer_delay:
    description:
      en: Time between WAL flushes performed in the WAL writer.
    default: 200ms
    type: integer
    group: Write-Ahead Log / Settings
  wal_writer_flush_after:
    description:
      en: Amount of WAL written out by WAL writer that triggers a flush.
    default: 1MB
    type: integer
    group: Write-Ahead Log / Settings
  work_mem:
    description:
      en: Sets the maximum memory to be used for query workspaces.
    default: 4MB
    type: integer
    group: Resource Usage / Memory
  xmlbinary:
    description:
      en: Sets how binary values are to be encoded in XML.
    default: base64
    type: enum
    group: Client Connection Defaults / Statement Behavior
  xmloption:
    description:
      en: Sets whether XML data in implicit parsing and serialization operations is to be considered as documents or content fragments.
    default: content
    type: enum
    group: Client Connection Defaults / Statement Behavior
  zero_damaged_pages:
    description:
      en: Continues processing past damaged page headers.
    default: off
    type: bool
    group: Developer Options
