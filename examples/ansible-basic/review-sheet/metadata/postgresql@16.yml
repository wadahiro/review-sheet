      en: Sets whether to include or exclude transaction with recovery target.
    default: on
    type: bool
    group: Write-Ahead Log / Recovery Target
  recovery_target_lsn:
    description:
      en: Sets the LSN of the write-ahead log location up to which recovery will proceed.
    default: ""
    type: string
    group: Write-Ahead Log / Recovery Target
  recovery_target_name:
    description:
      en: Sets the named restore point up to which recovery will proceed.
    default: ""
    type: string
    group: Write-Ahead Log / Recovery Target
  recovery_target_time:
    description:
      en: Sets the time stamp up to which recovery will proceed.
    default: ""
    type: string
    group: Write-Ahead Log / Recovery Target
  recovery_target_timeline:
    description:
      en: Specifies the timeline to recover into.
    default: latest
    type: string
    group: Write-Ahead Log / Recovery Target
  recovery_target_xid:
    description:
      en: Sets the transaction ID up to which recovery will proceed.
    default: ""
    type: string
    group: Write-Ahead Log / Recovery Target
  recursive_worktable_factor:
    description:
      en: Sets the planner's estimate of the average size of a recursive query's working table.
    default: "10"
    type: real
    group: Query Tuning / Other Planner Options
  remove_temp_files_after_crash:
    description:
      en: Remove temporary files after backend crash.
    default: on
    type: bool
    group: Developer Options
  reserved_connections:
    description:
      en: Sets the number of connection slots reserved for roles with privileges of pg_use_reserved_connections.
    default: "0"
    type: integer
    group: Connections and Authentication / Connection Settings
