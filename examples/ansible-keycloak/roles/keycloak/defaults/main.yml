---
# Tunable parameters for the keycloak role. Each maps to a key in keycloak.conf
# (Quarkus, kebab-case) via the template. Per-environment overrides live in
# inventories/<env>/group_vars/keycloak.yml; anything not overridden there uses
# the value here (Pattern A). Ansible variables are snake_case, so the review
# sheet maps them to Keycloak's kebab-case keys via dict_key in sheet.yml.

# --- Database (vendor is fixed to postgres in the template; connection varies) ---
kc_db_url: "jdbc:postgresql://localhost/keycloak"
kc_db_username: keycloak
# Real projects source this from Ansible Vault; kept inline here only as a
# placeholder. Marked out_of_scope in the sheet (not reviewed as plaintext).
kc_db_password: "CHANGE_ME"

# --- Hostname ---
kc_hostname: "localhost"
kc_hostname_strict: true

# --- HTTP / TLS ---
kc_http_enabled: false
kc_http_port: 8080
kc_https_port: 8443
kc_https_certificate_file: "/etc/keycloak/tls/tls.crt"
kc_https_certificate_key_file: "/etc/keycloak/tls/tls.key"

# --- Reverse proxy ---
kc_proxy_headers: ""

# --- Observability (build-time options) ---
kc_health_enabled: true
kc_metrics_enabled: false

# --- Logging ---
kc_log: "console"
kc_log_level: "info"

# --- Cache (high availability) ---
kc_cache: "local"
kc_cache_stack: ""

# --- Realm (imported from data/import/realm-corp.json at start) --------------
# The realm this deployment serves. These back realm-corp.json.j2 and are
# reviewed as a second sheet, keyed by the realm export's own field names.
kc_realm_name: "corp"
kc_realm_display_name: "Corp SSO"
kc_realm_login_theme: "keycloak"
kc_realm_ssl_required: "external"

# Session and token lifetimes (seconds)
kc_realm_sso_session_idle_timeout: 1800
kc_realm_sso_session_max_lifespan: 36000
kc_realm_access_token_lifespan: 300

# Registration and login
kc_realm_registration_allowed: false
kc_realm_reset_password_allowed: true
kc_realm_verify_email: false
kc_realm_login_with_email_allowed: true
kc_realm_duplicate_emails_allowed: false
kc_realm_remember_me: false

# Brute force protection
kc_realm_brute_force_protected: true
kc_realm_failure_factor: 30
kc_realm_wait_increment_seconds: 60
kc_realm_password_policy: "length(12) and notUsername and passwordHistory(3)"

# SMTP (password lives in Vault; not templated here)
kc_realm_smtp_host: "smtp.example.internal"
kc_realm_smtp_port: 587
kc_realm_smtp_from: "noreply@example.com"
kc_realm_smtp_from_display_name: "Corp SSO"
kc_realm_smtp_auth: true
kc_realm_smtp_starttls: true
kc_realm_smtp_user: "keycloak-mailer"

# --- Clients (applied with partial import; see clients-partial-import.json.j2)
# One client per protocol. Reviewed as a third sheet, keyed by the client
# object's own field path (clients[clientId=corp-web].redirectUris).
kc_client_web_name: "Corp Web"
kc_client_web_enabled: true
kc_client_web_public: true
kc_client_web_root_url: "https://app.example.com"
kc_client_web_base_url: "/"
kc_client_web_redirect_uris: "https://app.example.com/*"
kc_client_web_web_origins: "https://app.example.com"
kc_client_web_standard_flow: true
kc_client_web_direct_access_grants: false
kc_client_web_full_scope_allowed: false
kc_client_web_post_logout_redirect_uris: "https://app.example.com/"
kc_client_web_backchannel_logout_url: "https://app.example.com/logout/backchannel"
kc_client_web_backchannel_logout_session_required: true

kc_client_saml_name: "Corp SAML SP"
kc_client_saml_enabled: true
kc_client_saml_admin_url: "https://sp.example.com/saml"
kc_client_saml_redirect_uris: "https://sp.example.com/*"
kc_client_saml_frontchannel_logout: true
kc_client_saml_client_signature: true
kc_client_saml_encrypt: false
kc_client_saml_signature_algorithm: "RSA_SHA256"
kc_client_saml_canonicalization_method: "http://www.w3.org/2001/10/xml-exc-c14n#"
kc_client_saml_name_id_format: "username"
kc_client_saml_acs_url_post: "https://sp.example.com/saml/acs"
kc_client_saml_slo_url_post: "https://sp.example.com/saml/slo"
