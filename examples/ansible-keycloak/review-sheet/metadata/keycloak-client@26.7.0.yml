      en: If it is On, lightweight access tokens are always used. If it is Off, they are not used by default, but it is still possible to enable them with client policy executor.
      ja: オンの場合、軽量アクセストークンが常に使用されます。オフの場合、デフォルトでは使用されませんが、クライアントポリシーエグゼキューターを使用して有効化することは可能です。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  client_credentials.use_refresh_token:
    description:
      en: If this is on, a refresh_token will be created and added to the token response if the client_credentials grant is used. The OAuth 2.0 RFC6749 Section 4.4.3 states that a refresh_token should not be generated when client_credentials grant is used. If this is off then no refresh_token will be generated and the associated user session will be removed.
      ja: オンの場合、grant_typeにclient_credentialsが指定されると、refresh_tokenパラメーターが作成され、トークンレスポンスに追加されます。RFC6749 OAuth 2.0のセクション4.4.3では、client_credentialが指定される場合はrefresh_tokenパラメーターを生成すべきではないと規定されています。オフの場合、refresh_tokenパラメーターは生成されず、関連付けられたユーザーセッションは削除されます。
