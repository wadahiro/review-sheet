    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  login_theme:
    description:
      en: Select theme for login, OTP, grant, registration and forgot password pages.
      ja: ログイン、OTP、グラント、登録、およびパスワード忘れに使用するページのテーマを選択します。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  logoUri:
    description:
      en: URL that references a logo for the Client application
      ja: クライアントアプリケーションのロゴを参照するURL
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  logout.confirmation.enabled:
    description:
      en: After the user logs out (OIDC RP-Initiated Logout), an additional confirmation page will be displayed showing a message such as 'You are logged out' before redirecting the user to the post-logout landing page. On this page, the user must confirm that they want to be redirected to the post-logout landing page.
      ja: ユーザーがログアウトした後（OIDC RPによるログアウト）、ランディングページにリダイレクトされる前に「ログアウトしました」などのメッセージが表示された確認ページが表示されます。このページで、ユーザーはログアウト後のランディングページにリダイレクトされることを確認する必要があります。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  minimum.acr.value:
    description:
      en: Minimum ACR to be enforced by Keycloak. If the resulting authentication context for the request is as strong as this ACR the request is valid, otherwise Keycloak returns the NoAuthnContext status error.
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  oid4vci.enabled:
    description:
      en: Enable this option to allow the client to request verifiable credentials from Keycloak's OID4VCI credential endpoint.
      ja: このオプションを有効にすると、クライアントはKeycloakのOID4VCIクレデンシャルエンドポイントから検証可能なクレデンシャルを要求できるようになります。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  policyUri:
    description:
      en: URL that the Relying Party Client provides to the End-User to read about the how the profile data will be used
      ja: プロファイルデータの使用方法について読み込むために、リライングパーティークライアントがエンドユーザーに提供するURL
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  post.logout.redirect.uris:
    description:
      en: Valid URI pattern a browser can redirect to after a successful logout. A value of '+' or an empty field uses the list of valid redirect URIs. A value of '-' does not allow any post logout redirect URIs. Simple wildcards are allowed such as 'http\://example.com/*'. A relative path can be specified too, such as /my/relative/path/*. Relative paths are relative to the client root URL; if none is specified, the auth server root URL is used.
      ja: ログアウト成功後にブラウザーがリダイレクトできる有効なURIパターン。「+」または空欄の場合は、有効なリダイレクトURIのリストが使用されます。「-」の場合は、ログアウト後のリダイレクトURIは許可されません。「http://example.com/*」のような単純なワイルドカードを使用できます。「/my/relative/path/*」のような相対パスも指定できます。相対パスはクライアントのルートURLを基準とします。ルートURLが指定されていない場合は、認証サーバーのルートURLが使用されます。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  request.object.encryption.alg:
    description:
      en: JWE algorithm, which a client needs to use when sending an OIDC request object specified by 'request' or 'request_uri' parameters. If set to 'any', encryption is optional and any algorithm is allowed.
      ja: クライアントが「request」または「request_uri」パラメーターで指定されたOIDCリクエストオブジェクトを送信する際に使用するJWEアルゴリズム。「any」に設定した場合、暗号化はオプションとなり、任意のアルゴリズムが許可されます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  request.object.encryption.enc:
    description:
      en: JWE algorithm, which the client needs to use when encrypting the content of the OIDC request object specified by the 'request' or 'request_uri' parameters. If set to 'any', any algorithm is allowed.
      ja: 「request」または「request_uri」のパラメーターで指定されたOIDCリクエストオブジェクトのコンテンツを暗号化する際に、クライアントが使用するJWEアルゴリズム。「any」に設定すると、任意のアルゴリズムが許可されます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  request.object.required:
    description:
      en: Specifies if the client needs to provide a request object with their authorization requests, and what method they can use for this. If set to "not required", providing a request object is optional. In all other cases, providing a request object is mandatory. If set to "request", the request object must be provided by value. If set to "request_uri", the request object must be provided by reference. If set to "request or request_uri", either method can be used.
      ja: クライアントが認可リクエストとともにリクエストオブジェクトを提供する必要があるかどうか、およびそのためにどの方法を使用できるかを指定します。「not required」に設定されている場合、リクエストオブジェクトの提供はオプションです。それ以外のケースでは、リクエストオブジェクトを提供する必要があります。「request」に設定されている場合、リクエストオブジェクトは値で提供される必要があります。「request_uri」に設定されている場合、リクエストオブジェクトは参照によって提供される必要があります。「requestまたはrequest_uri」に設定されている場合、いずれの方法も使用できます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  request.object.signature.alg:
    description:
      en: JWA algorithm, which the client needs to use when sending an OIDC request object specified by the 'request' or 'request_uri' parameters. If set to 'any', the Request object can be signed by any algorithm (including 'none').
      ja: クライアントが「request」または「request_uri」パラメーターで指定されたOIDCリクエストオブジェクトを送信する際に使用する必要がある、JWAアルゴリズムを設定します。「any」に設定した場合は、リクエストオブジェクトは任意のアルゴリズム（「none」を含む）で署名されます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  request.uris:
    description:
      en: List of valid URIs that can be used as values of the 'request_uri' parameter during an OpenID Connect authentication request. No support exists for the same capabilities as for Valid Redirect URIs. For example, wildcards or relative paths.
      ja: "OpenID Connectの認証リクエストで「request_uri」パラメーターの値として使用できる有効なURIのリスト。有効なリダイレクトURIのような機能（例: ワイルドカードや相対パス）はサポートされていません。"
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  require.pushed.authorization.requests:
    description:
      en: Boolean parameter indicating whether the authorization server accepts authorization request data only via the pushed authorization request method.
      ja: 認可サーバーがプッシュされた認可リクエスト方式でのみ認可リクエストデータを受け入れるかどうかを示すブール型パラメーター。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.assertion.lifespan:
    description:
      en: Lifespan set in the SAML assertion conditions. After that time the assertion will be invalid. The "SessionNotOnOrAfter" attribute is not modified and continue using the "SSO Session Max" time defined at realm level.
      ja: SAMLアサーション条件に設定された有効期間。その後、アサーションは無効になります。「SessionNotOnOrAfter」属性は変更されず、レルムレベルで定義された「SSOセッション最大時間」を引き続き使用します。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.client.signature:
    description:
      en: Will the client sign their saml requests and responses? And should they be validated?
      ja: クライアントがSAMLリクエストとレスポンスを署名するか、そしてそれらを検証すべきどうかか設定します。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.encrypt:
    description:
      en: Should SAML assertions be encrypted with client's public key?
      ja: SAMLアサーションをクライアントの公開鍵で暗号化すべきか。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.encryption.algorithm:
    description:
      en: Encryption algorithm used for the client. Default AES_256_GCM.
      ja: クライアントで使用される暗号化アルゴリズム。デフォルトはAES_256_GCMです。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.encryption.digestMethod:
    description:
      en: Digest method to use when any RSA-OAEP algorithm is selected as the key transport algorithm. Default value SHA-256.
      ja: 鍵転送アルゴリズムとしてRSA-OAEPアルゴリズムを選択した場合に使用するダイジェスト方式。デフォルト値はSHA-256です。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.encryption.keyAlgorithm:
    description:
      en: Key transport algorithm used for the client to encrypt the secret key used for encryption. Default value RSA-OAEP-11.
      ja: クライアントが暗号化に使用する秘密鍵を暗号化するために使用する鍵転送アルゴリズム。デフォルト値はRSA-OAEP-11です。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.encryption.maskGenerationFunction:
    description:
      en: Mask generation function to use when RSA-OAEP-11 is selected as the key transport algorithm. Default value mgf1sha256.
      ja: 鍵転送アルゴリズムとしてRSA-OAEP-11を選択した場合に使用するマスク生成関数。デフォルト値はmgf1sha256です。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.metadataDescriptorUrl:
    description:
      en: External URL where Service Provider publishes the metadata information needed by the server (certificates, keys, other URLs,...).
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.server.signature.keyinfo.xmlSigKeyInfoKeyNameTransformer:
    description:
      en: Signed SAML documents contain identification of signing key in KeyName element. For Keycloak / RH-SSO counterparty, use KEY_ID, for MS AD FS use CERT_SUBJECT, for others check and use NONE if no other option works.
      ja: 署名されたSAML文書には、KeyName要素の署名鍵の識別情報が含まれています。Keycloak / RH-SSOカウンターパーティーの場合は、KEY_IDを使用し、MS AD FSの場合はCERT_SUBJECTを使用します。他のオプションが動作しない場合はNONEをチェックして使用します。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml.signature.algorithm:
    description:
      en: The signature algorithm to use to sign documents. Note that 'SHA1' based algorithms are deprecated and can be removed in the future. It is recommended to stick to some more secure algorithm instead of '*_SHA1'.
      ja: ドキュメントに署名するために使用する署名アルゴリズム。「SHA1」ベースのアルゴリズムは非推奨であり、将来的に削除される可能性があります。「*_SHA1」の代わりに、より安全なアルゴリズムを使用することを推奨します。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_artifact_binding_url:
    description:
      en: URL to send the HTTP ARTIFACT messages to. You can leave this blank if you are using a different binding. This value should be set when forcing ARTIFACT binding together with IdP initiated login.
      ja: HTTP ARTIFACTメッセージを送信するURL。別のバインディングを使用している場合は空白のままにすることができます。この値はIdP起点のログインでARTIFACTバインディングを強制する場合に設定する必要があります。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_artifact_resolution_service_url:
    description:
      en: SAML Artifact resolution service for the client. This is the endpoint to which Keycloak will send a SOAP ArtifactResolve message. You can leave this blank if you do not have a URL for this binding.
      ja: クライアントのSAMLアーティファクト解決サービス。これは、KeycloakがSOAP ArtifactResolveメッセージを送信するエンドポイントです。このバインディングのURLがない場合は、空白のままにすることができます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_assertion_consumer_url_post:
    description:
      en: SAML POST Binding URL for the client's assertion consumer service (login responses). You can leave this blank if you do not have a URL for this binding.
      ja: アサーションコンシューマーサービス（ログインレスポンス）のSAML POSTバインディングURLを設定します。このバインディングのためのURLがない場合は空でよいです。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_assertion_consumer_url_redirect:
    description:
      en: SAML Redirect Binding URL for the client's assertion consumer service (login responses). You can leave this blank if you do not have a URL for this binding.
      ja: アサーションコンシューマーサービス（ログインレスポンス）のSAMLリダイレクトバインディングURLを設定します。このバインディングのためのURLがない場合は空でよいです。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_idp_initiated_sso_relay_state:
    description:
      en: Relay state you want to send with SAML request when you want to do IDP Initiated SSO.
      ja: IDP起点のSSOを行う際のSAMLリクエストで送信したいRelayState。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_idp_initiated_sso_url_name:
    description:
      en: "URL fragment name to reference client when you want to do IDP Initiated SSO. Leaving this empty will disable IDP Initiated SSO. The URL you will reference from your browser will be\\: {server-root}/realms/{realm}/protocol/saml/clients/{client-url-name}."
      ja: IDP起点のSSOを行う際にクライアントを参照するためのURLフラグメント名を設定します。空にするとIDP起点のSSOは無効になります。ブラウザーから参照するURLは「{server-root}/realms/{realm}/protocol/saml/clients/{client-url-name}」になります。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_name_id_format:
    description:
      en: The name ID format to use for the subject.
      ja: サブジェクトに使用するName IDフォーマット。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_signature_canonicalization_method:
    description:
      en: Canonicalization Method for XML signatures.
      ja: XML署名の正規化方式。
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_single_logout_service_url_artifact:
    description:
      en: SAML ARTIFACT Binding URL for the client's single logout service. You can leave this blank if you are using a different binding.
      ja: クライアントのシングルログアウトサービスのSAMLアーティファクトバインディングURL。別のバインディングを使用している場合は、空白のままにすることができます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_single_logout_service_url_post:
    description:
      en: SAML POST Binding URL for the client's single logout service. You can leave this blank if you are using a different binding.
      ja: シングルログアウトサービスのSAML POSTバインディングURLを設定します。異なるバインディングを使用している場合は空のままにします。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_single_logout_service_url_redirect:
    description:
      en: SAML Redirect Binding URL for the client's single logout service. You can leave this blank if you are using a different binding.
      ja: シングルログアウトサービスのSAMLリダイレクトバインディングURLを設定します。異なるバインディングを使用している場合は空にします。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  saml_single_logout_service_url_soap:
    description:
      en: SAML SOAP Binding URL for the client's single logout service. You can leave this blank if you are using a different binding.
      ja: クライアントのシングルログアウトサービスのSAML SOAPバインディングURL。別のバインディングを使用している場合は、空白のままにすることができます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.allowEmitEvents:
    description:
      en: When enabled, a service account holding the role configured below can push synthetic SSF events for this receiver via the admin emit endpoint. Use this for environments where Keycloak cannot natively observe upstream events (e.g. credential changes that happen in LDAP). If no role is configured the endpoint is refused. Callers that have permission to manage this client bypass the role check.
    type: string
    group: Emit Events / Events
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.autoNotifyOnLogin:
    description:
      en: When enabled and Default Subjects is set to NONE, users that log in via this client are automatically added to the set of subjects this receiver gets events about — equivalent to clicking Add for them on the Subjects tab. Useful for federated scenarios where only users that authenticate through this client should be included in event delivery.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.autoVerifyStream:
    description:
      en: When enabled, the transmitter automatically dispatches a stream-verification SET shortly after the receiver creates a stream. When disabled, the receiver can perform the verification by sending an explicit verification request to the verification endpoint.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.defaultSubjects:
    description:
      en: Controls whether the transmitter delivers events for all realm users (ALL) or only for users explicitly added via the add-subject endpoint or the Subjects tab (NONE). Receivers can override this per-stream at creation time.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.description:
    description:
      en: Free-form notes describing this SSF Receiver — e.g. which downstream system it represents, who owns it, what events it consumes. Operator-facing only; not exposed on the receiver-facing wire.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.enabled:
    description:
      en: If enabled, this client acts as a Shared Signals Framework (SSF) Receiver. Keycloak will transmit security events to this client according to the configured SSF stream.
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.inactivityTimeoutSeconds:
    description:
      en: SSF 1.0 inactivity_timeout — if no eligible receiver activity (any hit on the stream-management API, or a poll for POLL streams) arrives within this window, the transmitter automatically pauses the stream and sends a stream-updated event. Activity is tracked at a 5-minute granularity (write-coalesced to avoid hammering the client store on busy pollers), so the effective check may fire up to 5 minutes late — pick timeouts comfortably larger than that. Leave empty for no timeout.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.maxEventAgeSeconds:
    description:
      en: Maximum age (in seconds) of pending, held, or dead-letter outbox events for this receiver. Older rows are purged by the transmitter's housekeeping pass before the global dead-letter retention window applies. Use a short value for receivers whose events lose relevance fast (e.g. session-revoked). Leave inherited to fall back to the transmitter-wide retention only.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.minVerificationInterval:
    description:
      en: Minimum amount of time in seconds that must pass between receiver-initiated verification requests for this client's stream. Subsequent requests within this window are rejected with HTTP 429. Leave empty to use the transmitter-wide default.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.profile:
    description:
      en: The Shared Signals Framework profile to use when transmitting events to this receiver.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.pushEndpointConnectTimeoutMillis:
    description:
      en: Connect timeout in milliseconds when delivering SSF events via HTTP push to the receiver's push endpoint.
    type: string
    group: Emit Events / Delivery
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.pushEndpointSocketTimeoutMillis:
    description:
      en: Socket (read) timeout in milliseconds when delivering SSF events via HTTP push to the receiver's push endpoint.
    type: string
    group: Emit Events / Delivery
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.requireServiceAccount:
    description:
      en: When enabled, only the client's own service account can access the SSF transmitter API. This is the default behavior when not explicitly set. Disable for clients that use the authorization code flow where a real user authenticates and the receiver backend uses the resulting token to manage its SSF stream.
    type: string
    group: Emit Events / Authentication
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.streamAudience:
    description:
      en: Audience URI stamped on Security Event Tokens delivered to this receiver. If empty the transmitter falls back to a generated value of the form clientId/streamId so a receiver that registers more than one stream over time can disambiguate them on the wire.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.subjectRemovalGraceSeconds:
    description:
      en: SSF 1.0 ‘Malicious Subject Removal’ defense. After a receiver-driven /streams/subjects/remove the transmitter keeps delivering events for the subject for this many seconds, defending against a compromised receiver bearer token silently silencing events for a target. Admin-driven removes always take effect immediately. Leave empty to inherit the transmitter-wide subject-removal-grace-seconds SPI default; set to 0 to opt this receiver out of the grace window even when the transmitter default is positive (e.g. for receivers that legitimately remove subjects when users churn out of their service).
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.userSubjectFormat:
    description:
      en: Subject identifier format the transmitter uses for the user portion of SSF Security Event Tokens. Defaults to iss_sub (realm issuer + user ID). Select email to emit the user's email address instead. The +tenant variants wrap the user subject in a complex subject and add a tenant sibling carrying the user's Keycloak organization alias — use this when the receiver expects multi-tenant routing. Events are dropped (with a clear log entry) when the selected format cannot be produced (e.g. email selected but the user has no email, or +tenant selected but the user belongs to no organization).
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.validPushUrls:
    description:
      en: Allow-list of URL patterns the receiver may register as its push endpoint. Each entry is matched against the receiver-supplied URL using exact match or trailing-* suffix wildcard (e.g. https://receiver/push/* permits any tenant + stream id under that path). A URL outside the allow-list is rejected with HTTP 400 — this is the receiver's SSRF defence. Bare * is not honoured.
    type: string
    group: Emit Events / Delivery
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  ssf.verificationDelayMillis:
    description:
      en: Delay in milliseconds before the transmitter sends the verification event after the stream is created. Only applies when Auto-Verify Stream is enabled.
    type: string
    group: Emit Events / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  standard.token.exchange.enableRefreshRequestedTokenType:
    description:
      en: Controls if the Standard Token Exchange V2 allows to request a refresh token (parameter "requested_token_type" set to value "urn:ietf:params:oauth:token-type:refresh_token"). If this option is "No" (default), the refresh token request type is never allowed and an error is returned. If this option is "Same session", the returned refresh token is enforced to use the same session as the subject token, returning an error if that session is not available (for example if the subject token is transient).
      ja: 標準トークン交換V2 がリフレッシュトークンを要求できるかどうかを制御します（パラメーター「requested_token_type」の値が「urn:ietf:params:oauth:token-type:refresh_token」に設定されている場合）。このオプションが「No」の場合（デフォルト）、リフレッシュトークンリクエストのタイプは許可されず、エラーが返されます。このオプションが「Same session」の場合、返されるリフレッシュトークンはサブジェクトトークンと同じセッションを使用するように強制され、そのセッションが利用できない場合（例えば、サブジェクトトークンが一時的な場合）はエラーが返されます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  tls.client.certificate.bound.access.tokens:
    description:
      en: This enables support for OAuth 2.0 Mutual TLS Certificate Bound Access Tokens, which means that Keycloak binds an access token and a refresh token with an X.509 certificate of a token requesting client exchanged in mutual TLS between keycloak's Token Endpoint and this client. These tokens can be treated as Holder-of-Key tokens instead of bearer tokens.
      ja: これにより、OAuth 2.0相互TLS証明書バインドアクセストークンがサポートされます。つまり、Keycloakは、Keycloakのトークンエンドポイントとこのクライアントの間で相互TLS認証により交換されるクライアントのX.509証明書と、アクセストークンおよびリフレッシュトークンをバインドします。これらのトークンは、ベアラートークンの代わりにHolder-of-Keyトークンとして扱うことができます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  token.endpoint.auth.signing.alg:
    description:
      en: The signature algorithm to use to sign documents. Note that 'SHA1' based algorithms are deprecated and can be removed in the future. It is recommended to stick to some more secure algorithm instead of '*_SHA1'.
      ja: ドキュメントに署名するために使用する署名アルゴリズム。「SHA1」ベースのアルゴリズムは非推奨であり、将来的に削除される可能性があります。「*_SHA1」の代わりに、より安全なアルゴリズムを使用することを推奨します。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  token.endpoint.auth.signing.max.exp:
    description:
      en: Maximum expiration allowed for the JWT. Tokens need to be generated right before authentication. After this period will be considered invalid because they are too old. If undefined the default value is 60 seconds.
      ja: JWTの最大有効期限。トークンは認証直前に生成する必要があります。この期間を過ぎると、古すぎるため無効とみなされます。未定義の場合、デフォルト値は60秒です。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  token.response.type.bearer.lower-case:
    description:
      en: If this is on, token responses will be set the with the type "bearer" in lower-case. By default, the server sets the type as "Bearer" as defined by RFC6750.
      ja: オンの場合、トークンレスポンスには小文字の「bearer」型が設定されます。デフォルトでは、サーバーはRFC6750で定義されている「Bearer」型を設定します。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  tosUri:
    description:
      en: URL that the Relying Party Client provides to the End-User to read about the Relying Party's terms of service
      ja: リライングパーティークライアントがエンドユーザーに提供する、リライングパーティーの利用規約を読むためのURL
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  use.jwks.url:
    description:
      en: If the switch is ON, identity provider public keys are downloaded from a given JWKS URL. The result is great flexibility because new keys are downloaded again when the identity provider generates a new keypair. If the switch is OFF, a public key (or certificate) from the Keycloak database is used; therefore, when the identity provider keypair changes, you again need to import the new key to the Keycloak database.
      ja: 有効とした場合は、アイデンティティープロバイダーの公開鍵が指定されたJWKS URLからダウンロードされます。アイデンティティープロバイダーが新しい鍵ペアを生成する際に、新しい鍵が常に再ダウンロードされるため、柔軟性が大幅に向上します。無効とした場合は、KeycloakのDBの公開鍵（または証明書）が使用されるため、アイデンティティープロバイダーの鍵ペアが変更された際には、常にKeycloakのDBに新しい鍵をインポートする必要があります。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  use.refresh.tokens:
    description:
      en: If this is on, a refresh_token will be created and added to the token response. If this is off then no refresh_token will be generated.
      ja: onの場合、refresh_tokenが作成され、トークンレスポンスに追加されます。offの場合、refresh_tokenは作成されません。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  user.info.encrypted.response.alg:
    description:
      en: JWA Algorithm used for key management in encrypting User Info Endpoint responses. This option is needed if you want encrypted User Info Endpoint responses. If left empty, User Info Endpoint responses are not encrypted.
      ja: ユーザー情報エンドポイントのレスポンスを暗号化する際の鍵管理に使用されるJWAアルゴリズム。このオプションは、ユーザー情報エンドポイントのレスポンスを暗号化する場合に必要です。空のままにした場合、ユーザー情報エンドポイントのレスポンスは暗号化されません。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  user.info.encrypted.response.enc:
    description:
      en: JWA Algorithm used for content encryption in encrypting User Info Endpoint responses. If User Info response encryption key management algorithm is specified, the default for this value is A128CBC-HS256.
      ja: ユーザー情報レスポンスの暗号化におけるコンテンツ暗号化に使用されるJWAアルゴリズム。ユーザー情報レスポンスの暗号化キー管理アルゴリズムが指定されている場合、この値のデフォルトはA128CBC-HS256です。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  user.info.response.signature.alg:
    description:
      en: JWA algorithm used for signed User Info Endpoint response. If set to 'unsigned', User Info Response won't be signed and will be returned in application/json format.
      ja: UserInfoエンドポイントのレスポンスへの署名に使用するJWAアルゴリズムを設定します。「unsigned」に設定した場合はUserInfoレスポンスには署名されず、application/json形式で返されます。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  x509.allow.regex.pattern.comparison:
    description:
      en: If OFF, then the Subject DN from given client certificate must exactly match the given DN from the 'Subject DN' property as described in the RFC8705 specification. The Subject DN can be in the RFC4514 or RFC1779 format. If ON, then the Subject DN from given client certificate should match regex specified by 'Subject DN' property. This option is deprectated, in the future only exact DN comparison will be allowed.
      ja: OFFの場合、指定されたクライアント証明書のサブジェクトDNは、RFC8705仕様で規定されている「サブジェクトDN」プロパティーで指定されたDNと完全に一致する必要があります。サブジェクトDNは、RFC4514またはRFC1779の形式です。ONの場合、指定されたクライアント証明書のサブジェクトDNは、「サブジェクトDN」プロパティーで指定された正規表現と一致する必要があります。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  x509.casubjectdn:
    description:
      en: Subject DN of the root Certificate Authority (CA) that issued the certificate for the client (trust anchor). The CA Subject DN can be in the RFC4514 or RFC1779 format.
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  x509.subjectdn:
    description:
      en: Subject DN in the Client Certificate issued for the client. When using a regular expression, you can use "(.*?)(?\:$)" to match all kind of expressions.
      ja: クライアント証明書のサブジェクトDNを検証するための正規表現。あらゆる種類の表現に一致させるには、「(.*?)(?:$)」を使用します。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  authenticationFlowBindingOverrides:
    default: {}
    type: map
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  authenticationFlowBindingOverrides.browser:
    description:
      en: Select the flow you want to use for browser authentication.
      ja: ブラウザー認証で使用したいフローを選択してください。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  authenticationFlowBindingOverrides.direct_grant:
    description:
      en: Select the flow you want to use for direct grant authentication.
      ja: ダイレクトグラント認証で使用したいフローを選択してください。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  authorizationServicesEnabled:
    description:
      en: Enable/Disable fine-grained authorization support for a client.
      ja: きめ細かい認可のサポートを有効/無効にします。
    type: boolean
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  authorizationSettings:
    type: ResourceServerRepresentation
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  baseUrl:
    description:
      en: Default URL to use when the auth server needs to redirect or link back to the client.
      ja: 認証サーバーがクライアントにリダイレクトまたはリンクバックする必要がある場合に使用するデフォルトのURL。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  bearerOnly:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  clientAuthenticatorType:
    description:
      en: Client Authenticator used for authentication of this client against Keycloak server
      ja: Keycloakサーバーに対してこのクライアントの認証に使用するクライアント認証方法を設定します
    default: client-secret
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  clientId:
    description:
      en: The client identifier registered with the identity provider.
      ja: アイデンティティープロバイダーに登録されているクライアントの識別子。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  clientTemplate:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  consentRequired:
    description:
      en: If enabled, users have to consent to client access.
      ja: 有効の場合は、ユーザーはクライアントアクセスに同意する必要があります。
    default: false
    type: boolean
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  defaultClientScopes:
    type: list of string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  defaultRoles:
    type: String[]
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  description:
    description:
      en: "Specifies description of the client. For example 'My Client for TimeSheets'. Supports keys for localized values as well. For example\\: ${my_client_description}."
      ja: "クライアントの説明を指定します。例えば「タイムシート用のクライアント」です。ローカライズ用のキーもサポートしています。例: ${my_client_description}。"
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  directAccessGrantsEnabled:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  directGrantsOnly:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  enabled:
    default: true
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  frontchannelLogout:
    description:
      en: Front channel logout
      ja: フロントチャネルログアウト
    default: false
    type: boolean
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  fullScopeAllowed:
    description:
      en: Allows you to disable all restrictions.
      ja: 全ての制限の無効を許可します。
    default: true
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  id:
    description:
      en: The scopes associated with this resource.
      ja: このリソースに関連付けられたスコープです。
    type: string
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  implicitFlowEnabled:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  name:
    description:
      en: "Specifies display name of the client. For example 'My Client'. Supports keys for localized values as well. For example\\: ${my_client}."
      ja: "クライアントの表示名を指定します。例えば、「My Client」です。ローカライズ用のキーもサポートしています。例: ${my_client}。"
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  nodeReRegistrationTimeout:
    description:
      en: Interval to specify max time for registered clients cluster nodes to re-register. If cluster node will not send re-registration request to Keycloak within this time, it will be unregistered from Keycloak.
      ja: 登録されたクライアントをクラスターノードへ再登録する際の最大時間間隔を指定します。クラスターノードがこの時間内にKeycloakに再登録リクエストを送信しない場合は、Keycloakから登録解除されます。
    default: -1
    type: int
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  notBefore:
    description:
      en: Defines the time before which the policy MUST NOT be granted. Only granted if the current date/time is after or equal to this value.
      ja: ポリシーを許可しない日時を定義します。現在日時がこの値より後か、等しい場合にのみ許可されます。
    default: 0
    type: int
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  optionalClientScopes:
    type: list of string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  origin:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  protocol:
    description:
      en: "'OpenID Connect' allows Clients to verify the identity of the End-User based on the authentication performed by an Authorization Server.'SAML' enables web-based authentication and authorization scenarios including cross-domain single sign-on (SSO) and uses security tokens containing assertions to pass information."
      ja: 「OpenID Connect」は、クライアントが認可サーバーによって実行される認証に基づいてエンドユーザーのアイデンティティーを検証できます。「SAML」は、クロスドメインのシングルサインオン（SSO）を含むWebベースの認証および認可のシナリオを可能にし、アサーションを含むセキュリティートークンを使用して情報を渡します。
    default: openid-connect
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  protocolMappers:
    type: List<ProtocolMapperRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  publicClient:
    description:
      en: This switch defines the type of OIDC client. When it is ON, the type is confidential access. When it is OFF, the type is public access.
      ja: このスイッチはOIDCクライアントのタイプを定義します。ONの場合、タイプはコンフィデンシャルアクセスです。OFFの場合、タイプはパブリックアクセスです。
    default: false
    type: boolean
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  redirectUris:
    description:
      en: Valid URI pattern a browser can redirect to after a successful login. Simple wildcards are allowed such as 'http\://example.com/*'. Relative path can be specified too such as /my/relative/path/*. Relative paths are relative to the client root URL, or if none is specified the auth server root URL is used. For SAML, you must set valid URI patterns if you are relying on the consumer service URL embedded with the login request.
      ja: ログインまたはログインの成功後にブラウザーがリダイレクト可能とする、有効なURIパターンを設定します。「http://example.com/*」のような単純なワイルドカードが使用可能です。相対パス、つまり「/my/relative/path/*」も指定可能です。相対パスはクライアントのルートURLを基準とします。または、未指定の場合は認証サーバーのルートURLが使用されます。SAMLでは、ログインリクエストに埋め込まれたコンシューマーサービスのURLに依存している場合は、有効なURIパターンを設定する必要があります。
    type: list of string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  registeredNodes:
    type: Map<String, Integer>
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  registrationAccessToken:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  rootUrl:
    description:
      en: Root URL appended to relative URLs
      ja: 相対URLに追加されたルートURL
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  secret:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  serviceAccountsEnabled:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  standardFlowEnabled:
    default: true
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  surrogateAuthRequired:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  type:
    description:
      en: The type of this resource. It can be used to group different resource instances with the same type.
      ja: このリソースのタイプ。同じタイプの異なるリソースインスタンスをグループ化するために使用できます。
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  useTemplateConfig:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  useTemplateMappers:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  useTemplateScope:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  webOrigins:
    description:
      en: Allowed CORS origins. To permit all origins of Valid Redirect URIs, add '+'. This does not include the '*' wildcard though. To permit all origins, explicitly add '*'.
      ja: 許可されるCORSオリジンを設定します。有効なリダイレクトURIのすべてのオリジンを許可するには「+」を追加してください。ただし、これには「*」ワイルドカードは含まれません。すべてのオリジンを許可するには、明示的に「*」を追加してください。
    type: list of string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
