  backchannel.logout.url:
    description:
      en: URL that will cause the client to log itself out when a logout request is sent to this realm (via end_session_endpoint). The logout is done by sending logout token as specified in the OIDC Backchannel logout specification. If omitted, the logout request might be sent to the specified 'Admin URL' (if configured) in the format specific to Keycloak/RH-SSO adapters. If even 'Admin URL' is not configured, no logout request will be sent to the client.
      ja: このレルムに（end_session_endpoint経由で）ログアウトリクエストが送信された際に、クライアントがログアウトするURL。ログアウトは、OIDCバックチャネルログアウトの仕様で指定されているログアウトトークンを送信することで実行されます。省略した場合、ログアウトリクエストはKeycloak/RH-SSOアダプター固有の形式で、指定された「管理URL」（設定されている場合）に送信される可能性があります。「管理URL」が設定されていない場合、ログアウトリクエストはクライアントに送信されません。
