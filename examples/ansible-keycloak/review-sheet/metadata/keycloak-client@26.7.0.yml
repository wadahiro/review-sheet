      en: "Allowed method for client secret authentication. If set to client_secret_basic, then client secret needs to be sent in the HTTP 'Authorization: Basic' header when authenticating this client. When set to client_secret_post, then client secret needs to be sent as a parameter in the request body together with client_id. When empty, both Authorization header and request body parameters are allowed."
      ja: "クライアントシークレット認証に使用できる方法。client_secret_basicに設定した場合、このクライアントを認証する際に、クライアントシークレットをHTTPの「Authorization: Basic」ヘッダーで送信する必要があります。client_secret_postに設定した場合、クライアントシークレットをリクエストボディのパラメーターとしてclient_idと共に送信する必要があります。空の場合、Authorizationヘッダーとリクエストボディーの両方のパラメーターが許可されます。"
