      en: Text that will be shown on the consent screen when this client scope is added to some client with consent required. The placeholder 0 can be used to reference the parameter if the scope is dynamic (between curly brackets). Defaults to name of client scope if it is not filled.
      ja: 同意が必要なクライアントにこのクライアントスコープが追加された場合に、同意画面に表示されるテキスト。指定しない場合は、デフォルトでクライアントスコープの名前になります。
