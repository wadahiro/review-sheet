    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  jwks.url:
    description:
      en: URL where identity provider keys in JWK format are stored. See the JWK specification for more details. If you use an external Keycloak identity provider, you can use a URL such as 'http\://broker-keycloak\:8180/realms/test/protocol/openid-connect/certs' assuming your brokered Keycloak is running on 'http\://broker-keycloak\:8180' and its realm is 'test'.
      ja: JWK形式のアイデンティティープロバイダーキーが保存されるURL。詳細はJWK仕様を参照してください。外部Keycloakアイデンティティープロバイダーを使用する場合は、ブローカーであるKeycloakが「http://broker-keycloak:8180」で実行されており、レルムが「test」であると仮定すると、「http://broker-keycloak:8180/realms/test/protocol/openid-connect/certs」のようなURLを使用できます。
