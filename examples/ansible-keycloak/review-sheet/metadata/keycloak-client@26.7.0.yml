    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  dpop.bound.access.tokens:
    description:
      en: This enables support for Demonstrating Proof-of-Possession (DPoP) bound tokens. For public clients, both access and refresh tokens are bound to the key stored on the client. In order to prove the possession of the key, the client must send a signed proof alongside the token. For confidential clients, only access tokens are DPoP bound because, following the specification, refresh tokens are already sender-constrained by the associated authentication requirement.
      ja: これにより、DPoP（Demonstrating Proof-of-Possession）にバインドされたトークンのサポートが可能になります。アクセストークンとリフレッシュトークンは、ユーザーエージェントに保存されている鍵にバインドされます。鍵の所有を証明するために、ユーザーエージェントはトークンと共に署名された証明を送信する必要があります。
    type: string
    group: Settings
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
