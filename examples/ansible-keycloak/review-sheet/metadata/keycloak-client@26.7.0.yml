    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  id.token.encrypted.response.alg:
    description:
      en: JWA Algorithm used for key management in encrypting ID tokens. This option is needed if you want encrypted ID tokens. If left empty, ID Tokens are just signed, but not encrypted.
      ja: IDトークンの暗号化鍵の管理に使用されるJWAアルゴリズム。このオプションは、暗号化されたIDトークンが必要な場合に必須です。空のままにすると、IDトークンは署名されますが、暗号化されません。
    type: string
    group: Advanced
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#ClientRepresentation
  id.token.encrypted.response.enc:
    description:
      en: JWA Algorithm used for content encryption in encrypting ID tokens. This option is needed just if you want encrypted ID tokens. If left empty, ID Tokens are just signed, but not encrypted.
