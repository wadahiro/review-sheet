      en: If enabled, allows managing verifiable credentials in this realm.
      ja: 有効にすると、このレルムで検証可能なクレデンシャルを管理できるようになります。
    default: false
    type: boolean
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  verifyEmail:
