    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  emailTheme:
    description:
      en: Select a theme for emails that are sent by the server.
      ja: サーバーから送信されるメールのテーマを選択します。
    type: string
    group: Themes
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  enabled:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  enabledEventTypes:
    type: list of string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  eventsEnabled:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  eventsExpiration:
    type: long
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  eventsListeners:
    description:
      en: Configure what listeners receive events for the realm.
      ja: どのリスナーがレルムのイベントを受け取るかを設定します。
    type: list of string
    group: Events
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  failureFactor:
    description:
      en: Number of failures before wait is triggered.
      ja: 検出するまでの失敗回数。
    default: 30
    type: int
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  federatedUsers:
    type: List<UserRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  firstBrokerLoginFlow:
    default: first broker login
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  groups:
    type: List<GroupRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  id:
    description:
      en: Provider ID
      ja: プロバイダーID
    type: string
    group: Providers
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  identityProviderMappers:
    type: List<IdentityProviderMapperRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  identityProviders:
    type: List<IdentityProviderRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  internationalizationEnabled:
    description:
      en: If enabled, you can choose which locales you support for this realm and which locale is the default.
      ja: 有効にすると、このレルムでサポートするロケールとデフォルトのロケールを選択できます。
    default: false
    type: boolean
    group: Localization
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  keycloakVersion:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  localizationTexts:
    type: Map<String, String>>
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  loginTheme:
    description:
      en: Select theme for login, OTP, grant, registration and forgot password pages.
      ja: ログイン、OTP、グラント、登録、およびパスワード忘れに使用するページのテーマを選択します。
    type: string
    group: Themes
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  loginWithEmailAllowed:
    description:
      en: Allow users to log in with their email address.
      ja: ユーザーがメールアドレスでログインできるようにします。
    default: true
    type: boolean
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  maxDeltaTimeSeconds:
    default: 43200
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  maxFailureWaitSeconds:
    default: 900
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  maxSecondaryAuthFailures:
    description:
      en: Maximum number of secondary authentication failures before permanent lockout is triggered. Account will be locked even in temporary lockout brute force modes. Value of 0 means the behavior is disabled.
      ja: 永久ロックアウトがトリガーされる二段階認証の失敗回数。一時的なロックアウトのブルートフォースモードでもアカウントはロックされます。値が0の場合は、この動作は無効になります。
    default: 0
    type: int
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  maxTemporaryLockouts:
    description:
      en: The number of temporary lockouts permitted before the user is permanently locked out.
      ja: ユーザーが永続的にロックアウトされる前に許可される一時的なロックアウトの回数。
    default: 0
    type: int
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  minimumQuickLoginWaitSeconds:
    default: 60
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  notBefore:
    default: 0
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  oauth2DeviceCodeLifespan:
    description:
      en: Max time before the device code and user code are expired. This value needs to be a long enough lifetime to be usable (allowing the user to retrieve their secondary device, navigate to the verification URI, login, etc.), but should be sufficiently short to limit the usability of a code obtained for phishing.
      ja: デバイスコードとユーザーコードの有効期限が切れるまでの最大時間。この値は、ユーザーがセカンダリーデバイスを取得したり、検証URIにアクセスしたり、ログインしたりできるようにするために十分な長さである必要がありますが、フィッシングに使用されたコードの使用を制限するのに十分な短さである必要もあります。
    default: 600
    type: int
    group: Tokens / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  oauth2DevicePollingInterval:
    description:
      en: The minimum amount of time in seconds that the client should wait between polling requests to the token endpoint.
      ja: トークンエンドポイントへのポーリングリクエストの間でクライアントが待機する必要がある最小時間（秒）。
    default: 5
    type: int
    group: Tokens / General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  oauthClients:
    type: List<OAuthClientRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  offlineSessionIdleTimeout:
    description:
      en: Time an offline session is allowed to be idle before it expires. You need to use offline token to refresh at least once within this period; otherwise offline session will expire.
      ja: セッションの有効期限が切れるまでのオフライン時間です。この期限内に少なくとも1回はオフライントークンを使用してリフレッシュしないと、オフラインセッションは有効期限切れとなります。
    default: 2592000
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  offlineSessionMaxLifespan:
    description:
      en: Max time before an offline session is expired regardless of activity.
      ja: アクティビティーに関係ない、オフラインセッションの有効期限が切れるまでの最大時間。
    default: 5184000
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  offlineSessionMaxLifespanEnabled:
    description:
      en: Enable offline session maximum lifetime
      ja: オフラインセッションの最大有効期間を有効にする
    default: false
    type: boolean
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  organizations:
    type: List<OrganizationRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  organizationsEnabled:
    description:
      en: If enabled, allows managing organizations. Otherwise, existing organizations are still kept but you will not be able to manage them anymore or authenticate their members.
      ja: 有効にすると、組織の管理が可能になります。無効にすると、既存の組織は維持されますが、管理やメンバーの認証はできなくなります。
    default: false
    type: boolean
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyAlgorithm:
    default: HmacSHA1
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyCodeReusable:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyDigits:
    default: 6
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyInitialCounter:
    default: 0
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyLookAheadWindow:
    default: 1
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyPeriod:
    default: 30
    type: int
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpPolicyType:
    default: totp
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  otpSupportedApplications:
    type: list of string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  passwordCredentialGrantAllowed:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  passwordPolicy:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  permanentLockout:
    default: false
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  privateKey:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  protocolMappers:
    type: List<ProtocolMapperRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  publicKey:
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  quickLoginCheckMilliSeconds:
    description:
      en: If a failure happens concurrently too quickly, lock out the user.
      ja: クイックログイン失敗があまりにも頻繁に発生した場合は、ユーザーをロックアウトします。
    default: 1000
    type: long
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  realm:
    description:
      en: Realm name
      ja: レルム名
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  realmCacheEnabled:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  refreshTokenMaxReuse:
    description:
      en: Maximum number of times a refresh token can be reused. When a different token is used, revocation is immediate.
      ja: リフレッシュトークンを再利用できる回数。別のトークンが使用された場合、即時に無効化されます。
    default: 0
    type: int
    group: Tokens / Refresh tokens
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  registrationAllowed:
    description:
      en: Enable/disable the registration page. A link for registration will show on the login page too.
      ja: 登録ページの有効/無効。ログインページに登録のリンクも表示されるようになります。
    default: false
    type: boolean
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  registrationEmailAsUsername:
    description:
      en: Allow users to set email as username.
      ja: ユーザーが電子メールをユーザー名として設定できるようにします。
    default: false
    type: boolean
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  registrationFlow:
    default: registration
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  rememberMe:
    description:
      en: Show checkbox on the login page to allow the user to remain logged in between browser restarts until the session expires. If disabled, all sessions created with the "Remember me" checkbox selected during login are considered invalid.
      ja: セッションの有効期限が切れるまでは、ブラウザーを再起動してもログイン状態を保存するチェックボックスがログインページに表示されます。
    default: false
    type: boolean
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  requiredActions:
    type: List<RequiredActionProviderRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  requiredCredentials:
    type: list of string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  resetCredentialsFlow:
    default: reset credentials
    type: string
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  resetPasswordAllowed:
    description:
      en: Show a link on the login page for users who have forgotten their credentials.
      ja: クレデンシャルを忘れたユーザーのために、ログインページにリンクを表示します。
    default: false
    type: boolean
    group: Login
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  revokeRefreshToken:
    description:
      en: If enabled, a refresh token can only be used up to 'Refresh Token Max Reuse' and it is revoked when a different token is used. Otherwise, refresh tokens are not revoked when used and can be used multiple times.
      ja: 有効にすると、リフレッシュトークンは「リフレッシュトークンの最大再利用回数」までしか使用できず、別のトークンが使用されると無効化されます。無効にすると、リフレッシュトークンは使用後に無効化されず、複数回使用できます。
    default: false
    type: boolean
    group: Tokens / Refresh tokens
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  roles:
    type: RolesRepresentation
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  scimApiEnabled:
    description:
      en: If enabled, exposes realm resources through an API based on the System for Cross-domain Identity Management (SCIM) specification, namely RFC7643 and RFC7644.
    default: false
    type: boolean
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  scopeMappings:
    type: List<ScopeMappingRepresentation>
    kind: container
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer:
    default: {}
    type: map
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.allowutf8:
    description:
      en: Enable to allow UTF-8 characters in the local part of the email address. This should only be enabled if the mail server supports UTF-8 via the SMTPUTF8 extension. If disabled, domain names containing UTF-8 characters will be encoded using punycode, and addresses containing UTF-8 characters in the local part of the address will return an error.
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.auth:
    description:
      en: Authentication
      ja: 認証
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.authTokenClientId:
    description:
      en: Auth Token ClientId
      ja: 認証トークンクライアントID
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.authTokenClientSecret:
    description:
      en: Auth Token Client Secret
      ja: 認証トークンクライアントシークレット
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.authTokenScope:
    description:
      en: Auth Token Scope
      ja: 認証トークンスコープ
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.authTokenUrl:
    description:
      en: Auth Token URL
      ja: 認証トークンURL
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.authType:
    description:
      en: Authentication Type
      ja: 認証タイプ
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.connectionTimeout:
    description:
      en: The timeout in milliseconds for connecting to the SMTP server.
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.envelopeFrom:
    description:
      en: An email address used for bounces (optional).
      ja: バウンスに使用されるメールアドレス（オプション）。
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.from:
    description:
      en: From
      ja: 差出人
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.fromDisplayName:
    description:
      en: A user-friendly name for the 'From' address (optional).
      ja: 差出人のアドレスのユーザーフレンドリーな名前（オプション）。
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.host:
    description:
      en: Host
      ja: ホスト
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.password:
    description:
      en: SMTP password. This field is able to obtain its value from vault, use ${vault.ID} format.
      ja: SMTPパスワード。このフィールドは、ボールトから値を取得できます。${vault.ID}形式を使用します。
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.port:
    description:
      en: Port
      ja: ポート
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.replyTo:
    description:
      en: Reply to
      ja: 返信先
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.replyToDisplayName:
    description:
      en: A user-friendly name for the 'Reply-To' address (optional).
      ja: 返信先のアドレスのユーザーフレンドリーな名前（オプション）。
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.timeout:
    description:
      en: The timeout in milliseconds for reading from the SMTP server.
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.user:
    description:
      en: Username
      ja: ユーザー名
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  smtpServer.writeTimeout:
    description:
      en: The timeout in milliseconds for writing to the SMTP server.
    type: string
    group: Email
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  social:
    type: boolean
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  socialProviders:
    type: map
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  sslRequired:
    description:
      en: Is HTTPS required? 'None' means HTTPS is not required for any client IP address. 'External requests' means localhost and private IP addresses can access without HTTPS. 'All requests' means HTTPS is required for all IP addresses.
      ja: HTTPSが必須かどうか。「なし」は、HTTPSがどのIPアドレスのクライアントにも要求されないことを意味します。「外部リクエスト」は、ローカルホストとプライベートIPアドレスのクライアントがHTTPSなしでアクセスできることを意味します。「すべてのリクエスト」は、HTTPSがすべてのIPアドレスのクライアントに要求されることを意味します。
    default: external
    type: string
    group: General
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  ssoSessionIdleTimeout:
    description:
      en: Time a session is allowed to be idle before it expires. Tokens and browser sessions are invalidated when a session is expired.
      ja: セッションの有効期限が切れるまでのアイドル時間です。セッションの有効期限が切れると、トークンとブラウザーセッションは無効化されます。
    default: 1800
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  ssoSessionIdleTimeoutRememberMe:
    description:
      en: Time a remember me session is allowed to be idle before it expires. Tokens and browser sessions are invalidated when a session is expired. If not set it uses the standard SSO Session Idle value.
      ja: ログイン状態保存時のセッションの有効期限が切れるまでのアイドル時間です。セッションが期限切れになると、トークンおよびブラウザーセッションは無効になります。設定されていない場合は、標準のSSOセッションアイドル値が使用されます。
    default: 0
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  ssoSessionMaxLifespan:
    description:
      en: Max time before a session is expired. Tokens and browser sessions are invalidated when a session is expired.
      ja: セッションが切れるまでの最大時間です。セッションが切れるとトークンとブラウザーセッションは無効化されます。
    default: 36000
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  ssoSessionMaxLifespanRememberMe:
    description:
      en: Max time before a session is expired when a user has set the remember me option. Tokens and browser sessions are invalidated when a session is expired. If not set it uses the standard SSO Session Max value.
      ja: ユーザーが「Remember me」オプションを設定している場合、セッションが期限切れになるまでの最大時間です。セッションが期限切れになると、トークンとブラウザーセッションは無効になります。設定されていない場合は、標準のSSOセッション最大値が使用されます。
    default: 0
    type: int
    group: Sessions
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
  supportedLocales:
    description:
      en: The locales to support for this realm. The user chooses one of these locales on the login screen.
      ja: このレルムがサポートするロケールです。ユーザーはログイン画面でこれらのロケールのいずれかを選択します。
    type: list of string
    group: Localization
    docs_url: https://www.keycloak.org/docs-api/latest/rest-api/index.html#RealmRepresentation
