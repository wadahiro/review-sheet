    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-async-queue-length:
    description: The queue length to use before flushing writing when logging to file log.
    default: "512"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-enabled:
    description: Enables log file rotation.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-max-file-size:
    description: The maximum log file size, after which a rotation is executed. Supports size suffixes (e.g. 10M, 1G).
    default: 10M
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-max-backup-index:
    description: The maximum number of backup log files to keep.
    default: "5"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-file-suffix:
    description: "Set the log file handler rotation file suffix. When used, the file will be rotated based on its suffix. Example: `.yyyy-MM-dd` to rotate daily. Note: If the suffix ends with `.zip` or `.gz`, the rotation file will also be compressed."
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-file-rotation-rotate-on-boot:
    description: Indicates whether to rotate log files on server start.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-enabled:
    description:
      en: Whether the syslog handler is enabled (also implied by listing `syslog` in `log`).
      ja: syslog ハンドラーを有効にするか（`log` に `syslog` を列挙した場合も有効になる）。
    provenance: community
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-endpoint:
    description: Set the IP address and port of the Syslog server.
    default: localhost:514
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-level:
    description: Set the log level for the Syslog handler. It specifies the most verbose log level for logs shown in the output. It respects levels specified in the 'log-level' option, which represents the maximal verbosity for the whole logging system. For more information, check the Logging guide.
    default: all
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-type:
    description: Set the Syslog type used to format the sent message.
    default: rfc5424
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-max-length:
    description: Set the maximum length, in bytes, of the message allowed to be sent. The length includes the header and the message. If not set, the default value is 2048 when 'log-syslog-type' is rfc5424 (default) and 1024 when 'log-syslog-type' is rfc3164.
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-app-name:
    description: Set the app name used when formatting the message in RFC5424 format.
    default: keycloak
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-protocol:
    description: Set the protocol used to connect to the Syslog server.
    default: tcp
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-format:
    description: Set a format specific to Syslog entries.
    default: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-json-format:
    description: Set the format of the produced JSON.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-include-trace:
    description: Include tracing information in the Syslog. If the 'log-syslog-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-include-mdc:
    description: Include MDC information in the Syslog. If the 'log-syslog-format' option is specified, this option has no effect.
    default: "true"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-output:
    description: Set the Syslog output to JSON or default (plain) unstructured logging.
    default: default
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-counting-framing:
    description: If 'true', the message being sent is prefixed with the size of the message. If 'protocol-dependent', the default value is 'true' when 'log-syslog-protocol' is 'tcp' or 'ssl-tcp', otherwise 'false'.
    default: protocol-dependent
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-async:
    description: Indicates whether to log asynchronously to Syslog. If not set, value from the parent property 'log-async' is used.
    default: "false"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-syslog-async-queue-length:
    description: The queue length to use before flushing writing when logging to Syslog.
    default: "512"
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-mdc-enabled:
    description: Indicates whether to add information about the realm and other information to the mapped diagnostic context. All elements will be prefixed with 'kc.'
    default: "false"
    scope: build-time
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  log-mdc-keys:
    description: Defines which information should be added to the mapped diagnostic context as a comma-separated list.
    default: realmName, clientId, org, sessionId, authenticationSessionId, authenticationTabId
    scope: runtime
    group: Logging
    docs_url: https://www.keycloak.org/server/all-config
  cache:
    description:
      en: Defines the cache mechanism for high-availability. By default in production mode, a 'ispn' cache is used to create a cluster between multiple server nodes. By default in development mode, a 'local' cache disables clustering and is intended for development and testing purposes.
      ja: 高可用性のためのキャッシュ機構。本番では既定で ispn（分散 Infinispan）。
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-stack:
    description:
      en: Define the default stack to use for cluster communication and node discovery. Defaults to 'jdbc-ping' if not set.
      ja: クラスタ通信とノード検出に使う既定スタック。
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-config-file:
    description: Defines the file from which cache configuration should be loaded from. The configuration file is relative to the 'conf/' directory.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-config-mutate:
    description: Determines whether changes to the default cache configurations are allowed. This is only recommended for advanced use-cases where the default cache configurations are proven to be problematic. The only supported way to change the default cache configurations is via the other 'cache-...' options.
    default: "false"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-enabled:
    description: Encrypts the network communication between Keycloak servers. If no additional parameters about a keystore and truststore are provided, ephemeral key pairs and certificates are created and rotated automatically, which is recommended for standard setups.
    default: "true"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-key-store-file:
    description: The Keystore file path. The Keystore must contain the certificate to use by the TLS protocol. By default, it looks up 'cache-mtls-keystore.p12' under conf/ directory.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-key-store-password:
    description: The password to access the Keystore.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-trust-store-file:
    description: The Truststore file path. It should contain the trusted certificates or the Certificate Authority that signed the certificates. By default, it lookup 'cache-mtls-truststore.p12' under conf/ directory.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-trust-store-password:
    description: The password to access the Truststore.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-mtls-rotation-interval-days:
    description: Rotation period in days of automatic JGroups MTLS certificates.
    default: "30"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-network-bind-address:
    description: IP address used by clustering transport. By default, SITE_LOCAL is used.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-network-bind-port:
    description: The Port the clustering transport will bind to. By default, port 7800 is used.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-network-external-address:
    description: IP address that other instances in the cluster should use to contact this node. Set only if it is different to cache-embedded-network-bind-address, for example when this instance is behind a firewall.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-embedded-network-external-port:
    description: Port that other instances in the cluster should use to contact this node. Set only if it is different to cache-embedded-network-bind-port, for example when this instance is behind a firewall
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-host:
    description: The hostname of the external Infinispan cluster.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-port:
    description: The port of the external Infinispan cluster.
    default: "11222"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-username:
    description: The username for the authentication to the external Infinispan cluster. It is optional if connecting to an unsecure external Infinispan cluster. If the option is specified, 'cache-remote-password' is required as well.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-password:
    description: The password for the authentication to the external Infinispan cluster. It is optional if connecting to an unsecure external Infinispan cluster. If the option is specified, 'cache-remote-username' is required as well.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-metrics-histograms-enabled:
    description: Enable histograms for metrics for the embedded caches.
    default: "false"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-tls-enabled:
    description: Enable TLS support to communicate with a secured remote Infinispan server. Recommended to be enabled in production.
    default: "true"
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  cache-remote-backup-sites:
    description: Configures a list of backup sites names to where the external Infinispan cluster backups the Keycloak data.
    scope: runtime
    group: Cache
    docs_url: https://www.keycloak.org/server/all-config
  fips-mode:
    description: Sets the FIPS mode. If 'non-strict' is set, FIPS is enabled but on non-approved mode. For full FIPS compliance, set 'strict' to run on approved mode. This option defaults to 'disabled' when 'fips' feature is disabled, which is by default. This option defaults to 'non-strict' when 'fips' feature is enabled.
    default: disabled
    scope: build-time
    group: Security
    docs_url: https://www.keycloak.org/server/all-config
  health-enabled:
    description:
      en: If the server should expose health check endpoints. If enabled, health checks are available at the '/health', '/health/ready' and '/health/live' endpoints.
      ja: ヘルスチェックエンドポイントを公開するか（build 時に確定）。
    default: "false"
    scope: build-time
    group: Health
    docs_url: https://www.keycloak.org/server/all-config
  metrics-enabled:
    description:
      en: If the server should expose metrics. If enabled, metrics are available at the '/metrics' endpoint.
      ja: メトリクスを公開するか（build 時に確定）。
    default: "false"
    scope: build-time
    group: Metrics
    docs_url: https://www.keycloak.org/server/all-config
  features:
    description: Enables a set of one or more features.
    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  features-disabled:
    description: Disables a set of one or more features.
    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  feature-<name>:
    description: "Enable/Disable specific feature <feature>. It takes precedence over the 'features', and 'features-disabled' options. Possible values are: 'enabled', 'disabled', or specific version (lowercase) that will be enabled (f.e. 'v2')"
    scope: build-time
    group: Features
    docs_url: https://www.keycloak.org/server/all-config
  transaction-xa-enabled-<datasource>:
    description: If set to true, XA for <datasource> datasource will be used.
    default: "true"
    scope: build-time
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-xa-enabled:
    description: If set to true, XA datasources will be used.
    default: "false"
    scope: build-time
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-default-timeout:
    description: The default transaction timeout. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d].
    default: 5m
    scope: runtime
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  transaction-setup-timeout:
    description: The transaction timeout for database migration/import/export transactions. May be an ISO 8601 duration value, an integer number of seconds, or an integer followed by one of [ms, h, m, s, d].
    default: 30m
    scope: runtime
    group: Transactions
    docs_url: https://www.keycloak.org/server/all-config
  server-async-bootstrap:
    description: If true, endpoints are opened while the bootstrap runs in the background. If false, endpoints are opened after bootstrap completes, ensuring the server is ready to handle requests. Async bootstrap is enabled by default when the health endpoints are also enabled, unless this option is explicitly set to false.
    scope: runtime
    group: Server
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-enabled:
    description: If HTTP access logging is enabled. By default this will log records in console.
    default: "false"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-pattern:
    description: The HTTP access log pattern. You can use the available named formats, or use custom format described in Quarkus documentation.
    default: common
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-exclude:
    description: A regular expression that can be used to exclude some paths from logging. For instance, '/realms/my-realm/.*' will exclude all subsequent endpoints for realm 'my-realm' from the log.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-masked-headers:
    description: Set of HTTP headers whose values must be masked when the 'long' pattern or '%{ALL_REQUEST_HEADERS}' format is enabled with the 'http-access-log-pattern' option. Selected security sensitive headers are always masked.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-masked-cookies:
    description: Set of HTTP Cookie headers whose values must be masked when the 'long' pattern or '%{ALL_REQUEST_HEADERS}' format is enabled with the 'http-access-log-pattern' option. Selected security sensitive cookies are always masked.
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-enabled:
    description: If HTTP access logging should be done to a separate file.
    default: "false"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-suffix:
    description: The HTTP access log file suffix. When rotation is enabled, a date-based suffix '.{yyyy-MM-dd}' is added before the specified suffix. If multiple rotations occur on the same day, an incremental index is appended to the date.
    default: .log
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-name:
    description: The HTTP access log file base name, which will create a log file name concatenating base and suffix (e.g. 'keycloak-http-access.log'). The file is located in the '/data/log' directory of the distribution.
    default: keycloak-http-access
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  http-access-log-file-rotate:
    description: If the HTTP Access log file should be rotated daily.
    default: "true"
    scope: runtime
    group: HTTP access log
    docs_url: https://www.keycloak.org/server/all-config
  tracing-enabled:
    description: Enables the OpenTelemetry tracing.
    default: "false"
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-endpoint:
    description: OpenTelemetry endpoint to connect to for traces. If not given, the value is inherited from the 'telemetry-endpoint' option.
    default: http://localhost:4317
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-jdbc-enabled:
    description: Enables the OpenTelemetry JDBC tracing.
    default: "true"
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-service-name:
    description: OpenTelemetry service name. Takes precedence over 'service.name' defined in the 'tracing-resource-attributes' property. If not given, the value is inherited from the 'telemetry-service-name' option.
    default: keycloak
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-resource-attributes:
    description: OpenTelemetry resource attributes present in the exported trace to characterize the telemetry producer. Values in format 'key1=val1,key2=val2'. If not given, the value is inherited from the 'telemetry-resource-attributes' option. For more information, check the Tracing guide.
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-protocol:
    description: OpenTelemetry protocol used for the telemetry data. If not given, the value is inherited from the 'telemetry-protocol' option.
    default: grpc
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-sampler-type:
    description: OpenTelemetry sampler to use for tracing.
    default: traceidratio
    scope: build-time
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-sampler-ratio:
    description: OpenTelemetry sampler ratio. Probability that a span will be sampled. Expected double value in interval [0,1].
    default: "1.0"
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-compression:
    description: OpenTelemetry compression method used to compress payloads. If unset, compression is disabled.
    default: none
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-infinispan-enabled:
    description: Enables the OpenTelemetry tracing for embedded Infinispan.
    default: "true"
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-header-<header>:
    description: OpenTelemetry header that will be part of the exporter request (mainly useful for providing Authorization header). Check the documentation on how to set environment variables for headers containing special characters or custom case-sensitive headers.
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  tracing-headers:
    description:
      en: Extra headers attached to outgoing OpenTelemetry trace exports.
      ja: OpenTelemetry のトレース送信に付与する追加ヘッダー。
    provenance: community
    scope: runtime
    group: Tracing
    docs_url: https://www.keycloak.org/server/all-config
  truststore-paths:
    description: List of pkcs12 (p12, pfx, or pkcs12 file extensions), PEM files, or directories containing those files that will be used as a system truststore.
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  truststore-kubernetes-enabled:
    description: If enabled, the server will automatically include the default Kubernetes service account CA certificate from "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt" and the OpenShift service CA certificate from "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt" when running in a container environment.
    default: "true"
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  tls-hostname-verifier:
    description: The TLS hostname verification policy for out-going HTTPS and SMTP requests. ANY should not be used in production.
    default: DEFAULT
    scope: runtime
    group: Truststore
    docs_url: https://www.keycloak.org/server/all-config
  vault:
    description: Enables a vault provider.
    scope: build-time
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-dir:
    description: If set, secrets can be obtained by reading the content of files within the given directory.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-pass:
    description: Password for the vault keystore.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-file:
    description: Path to the keystore file.
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
  vault-type:
    description: Specifies the type of the keystore file.
    default: PKCS12
    scope: runtime
    group: Vault
    docs_url: https://www.keycloak.org/server/all-config
